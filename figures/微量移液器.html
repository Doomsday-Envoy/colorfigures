<style>.mcap{display:none!important}@media (max-width:560px){.stat .v{font-size:20px!important}.stats{align-items:flex-end}}@media (min-width:561px){.vset{top:4px!important}#stats{top:var(--vset-h,44px)!important}}</style><style>@media (max-width:560px){body > header{display:none}}</style><script>window.FIG_A = () => innerWidth <= 560 ? 1.1 : .75;</script><script>window.LBL_U = () => { if (innerWidth > 560) return 0; const s = document.getElementById("fig"); return s && s.clientWidth && s.viewBox.baseVal.width ? s.viewBox.baseVal.width / s.clientWidth : 0; };</script></head>
<body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  // on a phone (LBL_U = drawing units per screen px) the pill is a numbered badge and the names go in a legend under the figure
  const u = window.LBL_U ? LBL_U() : 0, n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));
  const k = INK_K, [X,Y] = P(...p3), fs = u ? 10*u : 8.6*k, h = u ? 17*u : fs*1.8, w = u ? h*(n > 9 ? 1.3 : 1) : text.length*fs*.62 + fs*1.5, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}" data-n="${n}" data-t="${text}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`

    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      // every choice stays clickable, so nothing silently ignores a press:
      //   current:true  = the one in use (shown selected); a press just says so
      //   disabled:true = not possible right now (shown faded); a press says why (c.why, or a generic note)
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));

  window.__st = st;

  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));

      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------
   xrCallouts(items, B): pills in two columns either side of the object, sorted top to bottom so leaders never cross.
     items: [{ at:[x,y,z], text, on }], B: the object's bounds [x0, x1, y0, y1, z0, z1].
   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);
  const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(x0), OUTp), on(PX(x1), OUTp), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...on(PX(x0), OUTp), ...on(PX(x1), OUTp)], 2.8) + `</g>`;
}
function xrMount(getUI, caption, opt = {}){   // opt.labelsOnly: only the Labels switch (the insides are on show already)
  const ui = getUI(), q = new URLSearchParams(location.search), html = document.documentElement;
  if (q.get('labels') !== '1') html.classList.add('nolabels');
  if (ui.st.xr == null){ ui.st.xr = 0; ui.st.xrT = 0; }
  if (q.get('xr') === '1') ui.st.xr = ui.st.xrT = 1;
  const old = document.getElementById('lblctl'); if (old) old.style.display = 'none';
  const vset = document.createElement('div'); vset.className = 'vset';
  vset.innerHTML = '<div class="vrow">' + (opt.labelsOnly ? '' : '<button class="act" id="xrb" aria-pressed="false">See-through</button>') + '<button class="act" id="lblb" aria-pressed="false">Labels</button></div>';
  document.querySelector('.stage').appendChild(vset);
  // pages with a stats panel in the top right: the switches go just under it
  const place = () => { const sp = document.getElementById('stats'); vset.style.top = sp ? (sp.offsetTop + sp.offsetHeight + 10) + 'px' : ''; };
  place(); new ResizeObserver(place).observe(document.getElementById('stats') || vset);
  const xrb = document.getElementById('xrb'), lblb = document.getElementById('lblb');
  const sync = () => { if (xrb) xrb.setAttribute('aria-pressed', !!getUI().st.xrT); lblb.setAttribute('aria-pressed', !html.classList.contains('nolabels')); };
  if (xrb) xrb.onclick = () => { const u = getUI(), st = u.st; st.xr = st.xr || 0; st.xrT = st.xrT ? 0 : 1; sync();
    u.animate(dt => { const g = Math.sign(st.xrT - st.xr); st.xr = Math.min(1, Math.max(0, st.xr + g*dt/.7)); return st.xr !== st.xrT; }); };
  lblb.onclick = () => { html.classList.toggle('nolabels'); sync(); };
  sync();
  const cap = document.createElement('p'); cap.className = 'mcap'; document.querySelector('.stage').after(cap);
  const css = document.createElement('style');
  css.textContent = '.vset{position:absolute;top:4px;right:0;z-index:2}.vrow{display:flex;gap:6px}.vset .act[aria-pressed=true]{background:var(--ink);color:var(--paper)}'
    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'
    + '@media (max-width:560px){.vset{position:static;margin:4px 0}}';
  document.head.appendChild(css);
  const r0 = ui.render; ui.render = () => { r0(); const st = getUI().st; cap.style.opacity = st.xr > .5 ? 1 : 0; cap.textContent = caption(st); };
  ui.render();
}
// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...A, ...B], 2.8) + `</g>`;
}
// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){
    let s = sceneFn.apply(this, arguments);
    const st = opts.getSt(), k = ease(st.xr || 0);
    if (k > 0 && opts.under) s = xrUnder(s, opts.mech(st, k), k);   // the whole drawing is the object
    else if (k > 0 && !opts.inline) s = `<g opacity="${f(1 - .5*k)}">${s}</g><g opacity="${f(k)}">${opts.mech(st, k)}</g>`;   // inline: the figure ghosts its own case
    const items = k > .6 ? opts.inside(st) : opts.surface ? opts.surface(st) : [];
    return s + (items.length ? xrCallouts(items, opts.B) : '');
  };
}

/* ---------- game keypad: mountKeypad({ rows, hub:[col,row], action:'DROP', keys:[{ key:'ArrowLeft', glyph:'\u25c0', name, at:[col,row] }] })
   An inked pad under the buttons that sends the same keyboard events as the arrows and space (set window.GAME_KEYS = true
   so the arrows play instead of turning the camera). ---------- */
function mountKeypad(spec){
  const host = document.getElementById('btns'); if (!host) return;
  const css = document.createElement('style');
  css.textContent = `.kpad{display:flex;align-items:center;gap:16px;margin-top:6px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;
      background:var(--paper);box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    .kpad .dp{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(var(--rows),34px);gap:3px}
    .kpad .k{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:34px;height:34px;cursor:pointer;
      background:#fbf7ea;border:1.5px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);color:var(--ink);font:700 13px ui-monospace,Menlo,monospace;
      transition:transform .05s,box-shadow .05s,background .05s}
    .kpad .hub{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
    .kpad .hub i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:#e6e0d1}
    .kpad .go{all:unset;box-sizing:border-box;width:62px;height:62px;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#e2483d;border:1.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18);color:#fff;font:800 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;
      transition:transform .05s,box-shadow .05s}
    .kpad .go small{font:700 8px ui-monospace,Menlo,monospace;opacity:.85;letter-spacing:.08em;margin-top:2px}
    .kpad .down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .kpad .k.down{background:var(--accent,#f4b829)}
    .kpad .go.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
    @media (max-width:560px){.kpad{gap:22px;padding:10px 16px}.kpad .dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(var(--rows),44px)}
      .kpad .k,.kpad .hub{width:44px;height:44px;font-size:15px}.kpad .go{width:74px;height:74px}}`;
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.className = 'kpad'; pad.setAttribute('role', 'group'); pad.setAttribute('aria-label', 'Keypad');
  const dp = document.createElement('div'); dp.className = 'dp'; dp.style.setProperty('--rows', spec.rows);
  const els = {};
  for (const k of spec.keys){
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', k.name);
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${spec.action}<small>SPACE</small>`; go.setAttribute('aria-label', spec.action);
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

<script>
/* 微量移液器

Truth first — the game follows forward pipetting:
1. Drag the pipette over one of the three colour-coded solutions, set the
   volume, press the control button to the first stop, immerse the tip, then let
   the button return slowly. The piston rises and the air cushion pulls liquid
   into the disposable tip. Liquid never reaches the piston.
2. Drag the loaded pipette over the beaker. Press to the first stop to deliver
   the measured volume, then press to the second stop to blow out the residual.
3. The disposable tip is contaminated after a dispense. Drag the pipette over
   the yellow tip-waste box and release: the ejector sleeve drops the old tip
   and a clean tip is fitted before the next solution.
4. Invalid actions add a line-writing penalty to the handwritten note. Three
   mistakes stamp the note WASTED.
5. A wrong mixture can be discarded by dragging the beaker into the large
   integrated sink. When the three recorded amounts exactly match the recipe,
   a short-lived nuclear-style smoke column and shock ring appear and the
   liquid turns gold. Three seconds later the gold blackens, detonates, and
   throws the loose lab objects off the table.

Parts, each held by another part:
BODY        upper grip shell . lower shaft . volume-setting ring . front volume
            display with a digit counter . control-button guide
BUTTON      control cap . control-button stem . plunger rod . piston mount
MEASURE     piston . piston seal . cylinder . piston-return spring . air cushion
SETTING     volume-adjustment collar . threaded adjustment screw . counter wheels
LOWER       tip cone . ejector sleeve . ejector rod . ejector button . ejector spring
CONSUMABLE  transparent disposable tip . aspirated liquid
BENCH       three colour-coded solution vials . mixing beaker . small sink .
            yellow sharps/tip-waste box

Geometry is diagrammatic, 1 engine unit ≈ 1 mm. The blue test-tip length used by
the reference manual is 71 mm; the model uses 68 units and slightly enlarged

function micShift(kind, st){
  if (kind === 'pipette') return Dv(st.pipX - MIC_CX, st.pipY - MIC_SRC_Y, 0);
  return Dv(st.beakerX - MIC_MIX_X, st.beakerY - MIC_MIX_Y, st.beakerLift || 0);
}

function micBlastVector(kind, st){
  const b = ease(Math.max(0, Math.min(1, st.blast || 0)));
  const vectors = {
    pipette:[178, -182, 42],
    beaker:[142, -158, -108],
    waste:[-188, -92, -72],
    vialA:[-164, -122, -98],
    vialB:[-18, -218, 64],
    vialC:[172, -118, 126]
  };
  const [dx, dy, rot] = vectors[kind] || [0, 0, 0];
  return { b, dx:dx * b, dy:dy * b, rot:rot * b };
}

function micBlastTransform(kind, st, center){
  const v = micBlastVector(kind, st);
  return `translate(${f(v.dx)} ${f(v.dy)}) rotate(${f(v.rot)} ${f(center[0])} ${f(center[1])})`;
}

const micHex = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const micHexColor = a => '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');

function micHelix(x, y, z0, z1, radius, turns=7, phase=0, n=84){
  const out = [];
  for (let i = 0; i <= n; i++){
    const t = i / n;
    const a = phase + t * turns * Math.PI * 2;
    out.push([x + radius * Math.cos(a), y + radius * Math.sin(a), z0 + (z1 - z0) * t]);
  }
  return out;
}

function micStroke(pts, color=MIC_SPRING, width=.55){
  const d = pd(pts, false);
  return `<path d="${d}" fill="none" stroke="${MIC_INK}" stroke-width="${f(width + .65)}" stroke-linecap="round" stroke-linejoin="round"/>`
    + `<path d="${d}" fill="none" stroke="${color}" stroke-width="${f(width)}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function micDisplay(st){
  const y = st.moveY;
  const z = st.baseZ;
  const digits = String(st.volume).padStart(4, '0');
  const frontX = MIC_CX + 17.5;
  let s = shape(on(PX(frontX), rrUV(y - 12.5, 168 + z, y + 12.5, 192 + z, 2.2)), '#202a27', 1.25);
  s += shape(on(PX(frontX + .12), rrUV(y - 10.5, 170 + z, y + 10.5, 190 + z, 1.2)), '#12201c', .7);
  for (let i = 0; i < 4; i++){
    const a = digits[i];
    s += tx(frontX + .22, y, 187.5 + z - i * 4.4, a, 3.5, '#8af0ae', 800);
  }
  return s;
}

function micVolumeRing(st, material){
  const y = st.moveY;
  const z = st.baseZ;
  const A = micRing(y, 152 + z, 17.1, 19.2, 32);
  const B = micRing(y, 162 + z, 17.4, 19.5, 32);
  let s = micLoft(A, B, MIC_RING);
  for (let i = 0; i < 20; i++){
    const a = st.volAngle + i / 20 * Math.PI * 2;
    const nx = Math.cos(a), ny = Math.sin(a);
    if (!vis([nx, ny, 0])) continue;
    s += line([
      [MIC_CX + 17.35 * nx, y + 19.45 * ny, 153.1 + z],
      [MIC_CX + 17.35 * nx, y + 19.45 * ny, 160.9 + z]
    ], .48);
  }
  s += ink(pd(A), .7) + ink(pd(B), .9);
  return { svg:s, box:micBoxOf([...A, ...B], .5) };
}

function micBodyShell(st, material){
  const y = st.moveY;
  const z = st.baseZ;
  const levels = [
    [MIC_CONE_Z1, 8.4, 9.2],
    [118, 10.2, 11.6],
    [132, 13.2, 15.2],
    [145, 15.2, 17.2],
    [190, 16.5, 18.7],
    [199, 15.1, 17.1],
    [MIC_BODY_Z1, 10.0, 12.0]
  ];
  const parts = [];
  for (let i = 0; i < levels.length - 1; i++){
    const [za, rxa, rya] = levels[i];
    const [zb, rxb, ryb] = levels[i + 1];
    const A = micRing(y, za + z, rxa, rya, 32);
    const B = micRing(y, zb + z, rxb, ryb, 32);
    const svg = micLoft(A, B, material) + ink(pd(A), .55) + ink(pd(B), .6);
    parts.push({ box:micBoxOf([...A, ...B], .45), svg });
  }
  const top = micRing(y, MIC_BODY_Z1 + z, 10.0, 12.0, 32);
  parts.push({ box:micBoxOf(top, .3), svg:micCap(top, material, [0,0,1], tone, 1.1) });
  return byDepth(parts);
}

function micTipCone(st, material){
  const y = st.moveY;
  const z = st.baseZ;
  const A = micRing(y, MIC_TIP_Z1 + z, 4.2, 4.4, 24);
  const B = micRing(y, MIC_CONE_Z1 + z, 8.5, 9.2, 24);
  return {
    box:micBoxOf([...A, ...B], .4),
    svg:micLoft(A, B, material) + ink(pd(A), .8) + ink(pd(B), .75)
  };
}

function micEjectSleeve(st, material){
  const y = st.moveY;
  const z = st.baseZ;
  const shift = st.eject * 6;
  const A = micRing(y, 82 + z - shift, 10.2, 10.8, 26);
  const B = micRing(y, 110 + z - shift, 9.6, 10.4, 26);
  let s = micLoft(A, B, { l:material.l, m:material.m, d:material.d });
  s += ink(pd(A), 1.0) + ink(pd(B), .8);
  s += fill(pd(A), mix(material.d, '#000000', .18));
  return { box:micBoxOf([...A, ...B], .5), svg:s };
}

function micLiquidHeight(st){
  if (!st.tipAttached && !st.tipFalling) return 0;
  return Math.max(0, Math.min(1, st.tipFill || 0));
}

function micTipAssembly(st){
  if (!st.tipAttached && !st.tipFalling && !st.tipInWaste) return '';
  if (st.tipInWaste) return '';
  const y = st.moveY;
  const z = st.tipFalling ? st.baseZ - st.tipDrop * 48 : st.baseZ;
  const top = micRing(y, MIC_TIP_Z1 + z, 5.0, 5.2, 24);
  const bot = micRing(y, MIC_TIP_Z0 + z, 1.35, 1.45, 24);
  const tipFillAmount = micLiquidHeight(st);
  const liquidTopZ = MIC_TIP_Z0 + z + (MIC_TIP_Z1 - MIC_TIP_Z0 - 3) * tipFillAmount;
  const k = (liquidTopZ - (MIC_TIP_Z0 + z)) / (MIC_TIP_Z1 - MIC_TIP_Z0);
  const surface = micRing(y, liquidTopZ, 1.35 + (5.0 - 1.35) * k, 1.45 + (5.2 - 1.45) * k, 24);
  const tipLiquidMat = matOf(st.tipColor || MIC_LIQUID.l);
  let liquid = '';
  if (tipFillAmount > .005){
    liquid = micLoft(bot, surface, tipLiquidMat, toneI)
      + fill(pd(surface), mix(tipLiquidMat.l, '#ffffff', .16))
      + ink(pd(surface), .55);
  }
  const airTop = micRing(y, MIC_TIP_Z1 + z - 2, 4.65, 4.85, 24);
  const air = tipFillAmount > .005
    ? `<path d="${pd([[MIC_CX, y, liquidTopZ], [MIC_CX, y, MIC_TIP_Z1 + z - 2]], false)}" fill="none" stroke="${MIC_AIR}" stroke-width="1.0" stroke-dasharray="2 1.8" opacity=".8"/>`
    : '';
  const far = micLoft(top, bot, MIC_TIP, toneI);
  let s = `<g opacity=".42">${far}</g>` + liquid + `<g opacity=".28">${far}</g>`;
  s += hullInk([...top, ...bot], 1.0);
  s += ink(pd(top), 1.0) + ink(pd(airTop), .55);
  s += line([[MIC_CX - 2.3, y - .4, MIC_TIP_Z1 + z - 8], [MIC_CX - .8, y - .2, MIC_TIP_Z1 + z - 45]], .5)
    .replace(MIC_INK, '#ffffff');
  s += air;
  return `<g data-part="tip" data-color="${st.tipColor || ''}">${s}</g>`;
}

function micControlButton(st){
  const y = st.moveY;
  const z = st.baseZ;
  const down = st.button * 6.5;
  const stemA = micRing(y, 204 + z - down, 2.7, 3.0, 18);
  const stemB = micRing(y, 212 + z - down, 3.1, 3.4, 18);
  const capA = micRing(y, 211 + z - down, 7.0, 9.4, 24);
  const capB = micRing(y, MIC_BUTTON_Z1 + z - down, 6.5, 8.8, 24);
  let s = micLoft(stemA, stemB, MIC_STEEL, toneI);
  s += micLoft(capA, capB, MIC_BUTTON);
  s += micCap(capB, MIC_BUTTON, [0,0,1], toneI, 1.05);
  return { box:micBoxOf([...stemA, ...stemB, ...capA, ...capB], .5), svg:s };
}

function micEjectButton(st){
  const y = st.moveY;
  const z = st.baseZ;
  const frontX = MIC_CX + 17.7;
  const down = st.eject * 2.8;
  let s = shape(on(PX(frontX), rrUV(y - 3.6, 128 + z - down, y + 3.6, 141 + z - down, 2.0)), '#252a2d', 1.0);
  s += shape(on(PX(frontX + .25), rrUV(y - 2.5, 129.3 + z - down, y + 2.5, 139.7 + z - down, 1.6)), MIC_EJECT.l, .8);
  return { box:[[frontX - .2, y - 4, 127 + z - down], [frontX + .6, y + 4, 142 + z]], svg:s };
}

function micOuter(st, material){
  const button = micControlButton(st);
  const cone = micTipCone(st, material);
  const sleeve = micEjectSleeve(st, material);
  const ring = micVolumeRing(st, material);
  const body = micBodyShell(st, material);
  const front = act('volume', micDisplay(st), 'data-part="volume-display"')
    + act('eject', micEjectButton(st).svg, 'data-part="ejector"');
  const frontFacing = facing([1,0,0]);
  let s = byDepth([
    cone,
    sleeve,
    { box:[[MIC_CX - 18, st.moveY - 20, 145 + st.baseZ], [MIC_CX + 18, st.moveY + 20, 205 + st.baseZ]], svg:body },
    { ...ring, svg:act('volume', `<g data-part="volume-ring">${ring.svg}</g>`) },
    { ...button, svg:act('plunger', `<g data-part="plunger">${button.svg}</g>`) }
  ]);
  if (frontFacing) s += front;
  else s = front + s;
  return s;
}

function micNearSolution(st, x=st.pipX, y=st.pipY){
  let best = null;
  for (const sol of MIC_SOLUTIONS){
    const d = Math.hypot(x - sol.x, y - sol.y);
    if (d < 17 && (!best || d < best.d)) best = { ...sol, d };
  }
  return best;
}

function micNearBeaker(st, x=st.pipX, y=st.pipY){
  return Math.hypot(x - st.beakerX, y - st.beakerY) < 20;
}

function micBeakerOverSink(st){
  return st.beakerX > MIC_SINK_ZONE.x0 + 5
    && st.beakerX < MIC_SINK_ZONE.x1 - 5
    && st.beakerY > MIC_SINK_ZONE.y0 + 5
    && st.beakerY < MIC_SINK_ZONE.y1 - 5;
}

function micNearWaste(st, x=st.pipX, y=st.pipY){
  return Math.hypot(x - MIC_WASTE_X, y - MIC_WASTE_Y) < 18;
}

function micMixTotal(st){
  return MIC_SOLUTIONS.reduce((sum, sol) => sum + (st.contents[sol.id] || 0), 0);
}

function micMixColor(st){
  let a = [0, 0, 0], total = 0;
  for (const sol of MIC_SOLUTIONS){
    const amount = st.contents[sol.id] || 0;
    const rgb = micHex(sol.color);
    total += amount;
    a = a.map((v, i) => v + rgb[i] * amount);
  }
  let color = total > 0 ? micHexColor(a.map(v => v / total)) : MIC_GLASS.m;
  if ((st.success || 0) > .45) color = mix(color, MIC_GOLD, Math.min(1, ((st.success || 0) - .45) / .55));
  if ((st.blackness || 0) > 0) color = mix(color, '#101411', Math.min(1, st.blackness));
  return color;
}

function micSolutionVial(st, sol, active){
  const x = sol.x, y = sol.y;
  const bottomZ = 4, topZ = 38;
  const bottom = micRingAt(x, y, bottomZ, 7.2, 7.2, 28);
  const top = micRingAt(x, y, topZ, 10.8, 10.8, 28);
  const level = Math.max(.04, Math.min(1, st.sourceLevels[sol.id] || .4));
  const liquidZ = bottomZ + 29 * level;
  const liquidR = 7.2 + (10.8 - 7.2) * (liquidZ - bottomZ) / (topZ - bottomZ);
  const surface = micRingAt(x, y, liquidZ, liquidR, liquidR, 28);
  const liquidMat = matOf(sol.color);
  const liquid = micLoft(bottom, surface, liquidMat, toneI)
    + fill(pd(surface), mix(sol.color, '#ffffff', .2))
    + ink(pd(surface), .55);
  const glassFar = micLoft(top, bottom, MIC_GLASS, toneI);
  let s = `<g opacity=".36">${glassFar}</g>${liquid}<g opacity=".20">${glassFar}</g>`;
  s += hullInk([...top, ...bottom], 1.0) + ink(pd(top), 1.0);
  s += fill(pd(micRingAt(x, y, topZ - .1, 9.4, 9.4, 28)), mix(sol.color, '#ffffff', .58), 'opacity=".38"');
  s += tx(x + 10.2, y, 23, sol.id, 4.5, mix(sol.color, '#000000', .34), 800);
  if (active){
    const rim = micRingAt(x, y, topZ + .35, 11.15, 11.15, 30);
    s += `<path d="${pd(rim)}" fill="none" stroke="${MIC_EJECT.l}" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  return s;
}

function micBeaker(st){
  const x = MIC_MIX_X, y = MIC_MIX_Y;
  const lift = st.beakerLift || 0;
  const bottomZ = 4 + lift, topZ = 47 + lift;
  const bottom = micRingAt(x, y, bottomZ, 17.2, 17.2, 32);
  const top = micRingAt(x, y, topZ, 18.8, 18.8, 32);
  const total = micMixTotal(st);
  const fillK = Math.max(0, Math.min(1, total / MIC_CAPACITY));
  const lv = bottomZ + 34 * fillK;
  const surface = micRingAt(x, y, lv, 17.2 + 1.0 * fillK, 17.2 + 1.0 * fillK, 32);
  const liquidColor = micMixColor(st);
  const liquid = fillK > .001
    ? micLoft(bottom, surface, matOf(liquidColor), toneI)
      + fill(pd(surface), mix(liquidColor, '#ffffff', .16))
      + ink(pd(surface), .65)
    : '';
  const glassFar = micLoft(top, bottom, MIC_GLASS, toneI);
  let s = `<g opacity=".34">${glassFar}</g>${liquid}<g opacity=".24">${glassFar}</g>`;
  s += hullInk([...top, ...bottom], 1.25) + ink(pd(top), 1.25) + ink(pd(bottom), .8);
  if (micNearBeaker(st)){
    const rim = micRingAt(x, y, topZ + .35, 19.25, 19.25, 32);
    s += `<path d="${pd(rim)}" fill="none" stroke="${MIC_EJECT.l}" stroke-width="2.6" stroke-linecap="round"/>`;
  }
  for (const z of [14, 22, 30]){
    const p0 = [x + 17.5, y - 4, z + lift], p1 = [x + 17.5, y + 2, z + lift];
    if (facing([1,0,0])) s += line([p0, p1], .55);
  }
  if (facing([1,0,0])) s += tx(x + 18, y, 40 + lift, '烧杯', 3.8, MIC_INK, 800);
  if (st.success > .55 && (st.blackness || 0) < .05){
    const center = P(MIC_MIX_X, MIC_MIX_Y, lv + 2);
    const t = st.successT || 0;
    for (let i = 0; i < 13; i++){
      const a = i * Math.PI * 2 / 13 + t * .8;
      const r = 7 + (i % 4) * 3.5;
      const sx = center[0] + Math.cos(a) * r, sy = center[1] - 8 - Math.sin(a) * r * .55;
      const size = 2.0 + (i % 3) * .7;
      const color = i % 2 ? '#fff8c9' : '#f4a81f';
      s += `<path d="M${f(sx-size)} ${f(sy)}H${f(sx+size)}M${f(sx)} ${f(sy-size)}V${f(sy+size)}" stroke="${color}" stroke-width="1.35" stroke-linecap="round" opacity="${f(.58 + .32 * Math.sin(t * 4 + i))}"/>`
        + `<circle cx="${f(sx + 1.5)}" cy="${f(sy - 1.2)}" r=".8" fill="#ffffff" opacity=".75"/>`;
    }
  }
  const shift = micShift('beaker', st);
  const blast = micBlastVector('beaker', st);
  const center = P(MIC_MIX_X, MIC_MIX_Y, 25);
  return `<g data-drag="beaker" data-object="beaker" data-liquid="${liquidColor}" data-near="${micNearBeaker(st)}" data-blast="${f(blast.b)}" transform="translate(${f(shift[0] + blast.dx)} ${f(shift[1] + blast.dy)}) rotate(${f(blast.rot)} ${f(center[0])} ${f(center[1])})">${s}</g>`;
}

function micSink(st){
  const { x0, x1, y0, y1 } = MIC_SINK_ZONE;
  const outer = on(PZ(5.2), rrUV(x0, y0, x1, y1, 10));
  const rimInner = on(PZ(5.22), rrUV(x0 + 5, y0 + 5, x1 - 5, y1 - 5, 7));
  const topRect = rectUV(x0 + 5, y0 + 5, x1 - 5, y1 - 5);
  const floorRect = rectUV(x0 + 10, y0 + 10, x1 - 10, y1 - 10);
  let s = `<path d="${pd(outer)}${pd(rimInner)}" fill="${BOARD.l}" fill-rule="evenodd" stroke="${MIC_INK}" stroke-width="1.25"/>`;
  s += shape(on(PZ(2.55), floorRect), '#2f4247', .9);
  const low = on(PZ(2.55), floorRect);
  const high = on(PZ(5.18), topRect);
  for (const [a, b] of [[0, 1], [1, 2], [2, 3], [3, 0]]){
    const p = [high[a], high[b], low[b], low[a]];
    let nr = norm(cross(sub(p[1], p[0]), sub(p[3], p[0])));
    if (!isFinite(nr[0])) continue;
    if (nr[2] < 0) nr = nr.map(v => -v);
    if (vis(nr)) s += face(pd(p), mix('#51686c', '#ffffff', a % 2 ? .12 : .05));
  }
  s += ink(pd(rimInner), 1.0);
  s += fill(pd(micRingAt(MIC_SINK_X, MIC_SINK_Y, 2.68, 3.6, 3.6, 20)), '#18272b') + ink(pd(micRingAt(MIC_SINK_X, MIC_SINK_Y, 2.69, 3.6, 3.6, 20)), .55);
  s += rod([x0 + 14, y0 + 12, 5.2], [x0 + 14, y0 + 12, 47], 1.25, MIC_SINK_METAL, toneI, .85);
  s += rod([x0 + 14, y0 + 12, 47], [x0 + 38, y0 + 14, 47], 1.05, MIC_SINK_METAL, toneI, .72);
  s += rod([x0 + 38, y0 + 14, 47], [x0 + 38, y0 + 14, 38], .78, MIC_SINK_METAL, toneI, .65);
  s += cyl(x0 + 14, y0 + 12, 5.2, 7.0, 2.1, MIC_SINK_METAL, toneI, .7, 18);
  if (st.sinkFlash > .001){
    const k = st.sinkFlash;
    for (let i = 0; i < 3; i++){
      const r = 5 + i * 7 + (1 - k) * 14;
      s += `<g opacity="${f(k * (.65 - i * .13))}">${ink(pd(micRingAt(MIC_SINK_X, MIC_SINK_Y, 2.8, r, r * .55, 28)), .8)}</g>`;
    }
  }
  const near = st.beakerLift > 1 && micBeakerOverSink(st);
  if (near){
    s += `<path d="${pd(rimInner)}" fill="none" stroke="${MIC_EJECT.l}" stroke-width="2.8" stroke-linecap="round"/>`;
  }
  if (facing([1,0,0])) s += tx(x1 - 2, MIC_SINK_Y, 7.4, '水槽', 4.4, MIC_INK, 800);
  return act('sink', s, 'data-part="sink"');
}

function micWasteBox(st){
  const x0 = MIC_WASTE_X - 13, x1 = MIC_WASTE_X + 13;
  const y0 = MIC_WASTE_Y - 15, y1 = MIC_WASTE_Y + 15;
  let s = box(x0, y0, 3, x1, y1, 44, MIC_WASTE, tone, 1.05);
  s += shape([[x0 + 6, y0 + 5, 44.1], [x1 - 6, y0 + 5, 44.1], [x1 - 6, y1 - 5, 44.1], [x0 + 6, y1 - 5, 44.1]], '#292723', .9);
  if (micNearWaste(st)){
    const ring = micRingAt(MIC_WASTE_X, MIC_WASTE_Y, 44.2, 9.8, 8.2, 24);
    s += fill(pd(ring), MIC_EJECT.l, 'opacity=".24"') + ink(pd(ring), 1.0);
  }
  for (let i = 0; i < Math.min(3, st.wasteTips || 0); i++){
    const p = [MIC_WASTE_X - 4 + i * 4, MIC_WASTE_Y, 41.5];
    s += rod(p, [p[0], p[1] + 7, p[2] - 3], .55, MIC_TIP, toneI, .5);
  }
  s += tx(x1 + .15, MIC_WASTE_Y, 22, '废吸头', 3.7, MIC_INK, 800);
  const blast = micBlastVector('waste', st);
  const center = P(MIC_WASTE_X, MIC_WASTE_Y, 22);
  return `<g data-blast="${f(blast.b)}" transform="translate(${f(blast.dx)} ${f(blast.dy)}) rotate(${f(blast.rot)} ${f(center[0])} ${f(center[1])})">${s}</g>`;
}

function micPipetteObject(st, material, k){
  const base = { ...st, moveY:MIC_SRC_Y };
  let outer = micOuter(base, material);
  if (k > 0) outer = xrUnder(outer, micMech(base), k);
  const body = outer + micTipAssembly(base);
  const shift = micShift('pipette', st);
  const blast = micBlastVector('pipette', st);
  const center = P(MIC_CX, MIC_SRC_Y, 108);
  return `<g data-drag="pipette" data-object="pipette" data-blast="${f(blast.b)}" transform="translate(${f(shift[0] + blast.dx)} ${f(shift[1] + blast.dy)}) rotate(${f(blast.rot)} ${f(center[0])} ${f(center[1])})">${body}</g>`;
}

function micPipetteShadow(st, clip){
  const x = st.pipX, y = st.pipY, z = st.baseZ;
  return micSoftShadow([
    [x - 15, y - 18, z],
    [x + 15, y + 18, z],
    [x + 8, y + 8, z + 217],
    [x - 19, y - 20, z + 110]
  ], 3.15, clip, .20, .24);
}

function micMushroom(st){
  const age = Math.max(0, st.successT || 0);
  if (age <= .001 || age >= 4.1 || st.blackness > .86) return '';
  const grow = ease(Math.min(1, age / .62));
  const rise = ease(Math.min(1, age / 1.15));
  const fade = age < 2.15 ? 1 : Math.max(0, 1 - (age - 2.15) / 1.8);
  if (fade <= .01) return '';
  const bx = st.blastX ?? st.beakerX;
  const by = st.blastY ?? st.beakerY;
  const [ax, ay] = P(bx, by, 50 + (st.beakerLift || 0));
  const cloudY = ay - 78 * rise;
  const wobble = Math.sin(age * 2.3) * 1.8 * grow;
  const spread = 1 + .18 * Math.min(1, Math.max(0, age - 1.4));
  let s = '';

  if (age < .5){
    const flash = 1 - age / .5;
    for (let i = 0; i < 12; i++){
      const a = i / 12 * Math.PI * 2;
      s += `<path d="M${f(ax + Math.cos(a) * 5)} ${f(ay + Math.sin(a) * 3)}L${f(ax + Math.cos(a) * 32 * grow)} ${f(ay + Math.sin(a) * 20 * grow)}" stroke="#ff9a35" stroke-width="${f(1.4 * flash)}" stroke-linecap="round" opacity="${f(flash)}"/>`;
    }
  }
  const shockK = ease(Math.min(1, age / .8));
  const shockRing = micRingAt(bx, by, 3.28, 10 + 56 * shockK, 10 + 56 * shockK, 32);
  s += `<path d="${pd(shockRing)}" fill="none" stroke="${MIC_EJECT.l}" stroke-width="2.2" opacity="${f(.8 * (1 - shockK))}"/>`;

  const stemPuffs = [
    [0, -13, 9, 7],[-2, -27, 10, 8],[2, -42, 12, 9],[-1, -57, 13, 10]
  ];
  for (const [dx, dy, rx, ry] of stemPuffs){
    s += `<ellipse cx="${f(ax + dx * grow + wobble * .5)}" cy="${f(ay + dy * rise)}" rx="${f(rx * grow * spread)}" ry="${f(ry * grow * spread)}" fill="${MIC_SMOKE_GRAY}" stroke="${MIC_INK}" stroke-width=".65" opacity=".88"/>`;
  }
  const capPuffs = [
    [-38, 4, 18, 13],[-28, -6, 18, 14],[-16, -15, 18, 15],[-2, -20, 20, 16],
    [14, -18, 21, 17],[28, -12, 20, 15],[39, -2, 18, 13],[-6, 2, 26, 18],
    [-25, 11, 18, 11],[8, 9, 22, 13],[26, 8, 17, 10],[0, -6, 21, 17]
  ];
  for (const [dx, dy, rx, ry] of capPuffs){
    s += `<ellipse cx="${f(ax + dx * grow * spread + wobble)}" cy="${f(cloudY + dy * grow)}" rx="${f(rx * grow * spread)}" ry="${f(ry * grow * spread)}" fill="${MIC_SMOKE}" stroke="${MIC_INK}" stroke-width=".8" opacity=".94"/>`;
  }
  const lowerPuffs = [[-30,15,14,7],[-10,18,18,8],[14,16,16,8],[31,10,12,6]];
  for (const [dx, dy, rx, ry] of lowerPuffs){
    s += `<ellipse cx="${f(ax + dx * grow * spread + wobble)}" cy="${f(cloudY + dy * grow)}" rx="${f(rx * grow)}" ry="${f(ry * grow)}" fill="${MIC_SMOKE_GRAY}" opacity=".58"/>`;
  }
  const highlights = [[-25,-9,8,5],[-9,-15,9,5],[8,-12,8,5],[25,-7,6,4],[-2,-1,10,5]];
  for (const [dx, dy, rx, ry] of highlights){
    s += `<ellipse cx="${f(ax + dx * grow * spread + wobble)}" cy="${f(cloudY + dy * grow)}" rx="${f(rx * grow)}" ry="${f(ry * grow)}" fill="#fffdf2" opacity=".72"/>`;
  }
  s += `<path d="M${f(ax - 35*grow)} ${f(cloudY + 6*grow)}Q${f(ax - 8*grow)} ${f(cloudY - 22*grow)} ${f(ax + 30*grow)} ${f(cloudY - 2*grow)}M${f(ax - 18*grow)} ${f(cloudY + 15*grow)}Q${f(ax + 5*grow)} ${f(cloudY + 2*grow)} ${f(ax + 31*grow)} ${f(cloudY + 10*grow)}" fill="none" stroke="${MIC_INK}" stroke-width=".55" opacity=".48"/>`;
  for (let i = 0; i < 7; i++){
    const phase = age * 1.4 + i * 1.7;
    const px = ax + Math.sin(phase) * (20 + i * 3) * grow;
    const py = cloudY - (12 + (i % 4) * 9) * grow - Math.cos(phase) * 3;
    s += `<circle cx="${f(px)}" cy="${f(py)}" r="${f((1 + i % 2) * grow)}" fill="#fffdf2" stroke="${MIC_INK}" stroke-width=".5" opacity="${f(.35 + .2 * Math.sin(phase))}"/>`;
  }
  return `<g data-effect="mushroom" data-age="${f(age)}" data-fade="${f(fade)}" opacity="${f(fade)}" pointer-events="none">${s}</g>`;
}

function micExplosion(st){
  const raw = Math.max(0, Math.min(1, st.blast || 0));
  if (raw <= .001) return '';
  const b = ease(raw);
  const fade = Math.max(0, 1 - b);
  const [ax, ay] = P(st.blastX ?? st.beakerX, st.blastY ?? st.beakerY, 16);
  let s = `<ellipse cx="${f(ax)}" cy="${f(ay + 4)}" rx="${f(26 + 35*b)}" ry="${f(13 + 15*b)}" fill="#171a18" opacity=".34"/>`;
  s += `<path d="${pd(micRingAt(st.blastX, st.blastY, 3.32, 12 + 100*b, 12 + 100*b, 34))}" fill="none" stroke="${MIC_EJECT.l}" stroke-width="2.8" opacity="${f(.9 * fade)}"/>`;
  if (b < .52){
    const flash = 1 - b / .52;
    for (let i = 0; i < 16; i++){
      const a = i / 16 * Math.PI * 2 + .13;
      s += `<path d="M${f(ax + Math.cos(a) * 8)} ${f(ay + Math.sin(a) * 5)}L${f(ax + Math.cos(a) * 92)} ${f(ay + Math.sin(a) * 58)}" stroke="${i % 3 ? '#f4b829' : '#fff4d6'}" stroke-width="${f(1.3 + 2*flash)}" stroke-linecap="round" opacity="${f(flash)}"/>`;
    }
  }
  for (let i = 0; i < 18; i++){
    const a = i * 2.399 + .4;
    const dist = (18 + (i % 6) * 17) * b;
    const px = ax + Math.cos(a) * dist;
    const py = ay + Math.sin(a) * dist * .58 - (8 + (i % 4) * 12) * b;
    const r = 5 + (i % 5) * 2.9;
    s += `<circle cx="${f(px)}" cy="${f(py)}" r="${f(r)}" fill="${i % 3 ? MIC_SMOKE_GRAY : '#353936'}" stroke="${MIC_INK}" stroke-width=".65" opacity="${f(.78 * fade)}"/>`;
  }
  for (let i = 0; i < 12; i++){
    const a = i / 12 * Math.PI * 2 + .23;
    const r0 = 14 + 8 * b, r1 = 35 + 78 * b;
    s += `<path d="M${f(ax + Math.cos(a) * r0)} ${f(ay + Math.sin(a) * r0 * .55)}L${f(ax + Math.cos(a) * r1)} ${f(ay + Math.sin(a) * r1 * .55)}" stroke="${i % 2 ? MIC_EJECT.l : MIC_INK}" stroke-width="${f(1 + (i % 3) * .6)}" stroke-linecap="round" opacity="${f(.72 * fade)}"/>`;
  }
  return `<g data-effect="explosion" data-blast="${f(raw)}">${s}</g>`;
}

function micMech(st){
  const y = st.moveY;
  const z = st.baseZ;
  const down = st.button * 6.5;
  const parts = [];
  const put = (box, svg, part='') => parts.push({ box, svg:part ? `<g data-part="${part}">${svg}</g>` : svg });

  const cylTop = micRing(y, 148 + z, 8.2, 9.0, 26);
  const cylBot = micRing(y, 96 + z, 8.2, 9.0, 26);
  const cylShell = micLoft(cylTop, cylBot, MIC_GLASS, toneI);
  put(micBoxOf([...cylTop, ...cylBot], .4), `<g opacity=".3">${cylShell}</g>` + ink(pd(cylTop), .55) + ink(pd(cylBot), .55), 'cylinder');

  const rodBottom = [MIC_CX, y, 142 + z - down];
  const rodTop = [MIC_CX, y, 207 + z - down];
  put(micBoxOf([rodBottom, rodTop], 2), rod(rodBottom, rodTop, 1.65, MIC_STEEL, toneI, .85), 'plunger-rod');

  const pistonZ0 = 132 + z - down;
  const pistonZ1 = 144 + z - down;
  put([[MIC_CX - 5, y - 5, pistonZ0], [MIC_CX + 5, y + 5, pistonZ1]], cyl(MIC_CX, y, pistonZ0, pistonZ1, 4.7, MIC_STEEL, toneI, .95, 22), 'piston');

  const sealA = micRing(y, 129.5 + z - down, 6.2, 6.6, 24);
  const sealB = micRing(y, 133 + z - down, 6.2, 6.6, 24);
  put(micBoxOf([...sealA, ...sealB], .4), micLoft(sealA, sealB, matOf('#242b2e')) + ink(pd(sealA), .7) + ink(pd(sealB), .7), 'piston-seal');

  const springPts = micHelix(MIC_CX, y, 108 + z, 130 + z - down, 5.2, 8);
  put(micBoxOf(springPts, 6), micStroke(springPts), 'return-spring');

  const stopA = micRing(y, 148 + z, 7.7, 8.4, 24);
  const stopB = micRing(y, 152 + z, 7.7, 8.4, 24);
  put(micBoxOf([...stopA, ...stopB], .4), micLoft(stopA, stopB, MIC_RING) + ink(pd(stopA), .7) + ink(pd(stopB), .7), 'volume-stop');

  const screwA = [MIC_CX - 5.7, y + 4.5, 148 + z];
  const screwB = [MIC_CX - 5.7, y + 4.5, 177 + z];
  let screw = rod(screwA, screwB, .95, MIC_STEEL, toneI, .65);
  for (let zz = 150; zz <= 175; zz += 2.2){
    screw += line([[MIC_CX - 6.6, y + 4.5, zz + z], [MIC_CX - 4.8, y + 4.5, zz + z]], .3);
  }
  put(micBoxOf([screwA, screwB], 1.2), screw, 'volume-screw');

  const wheelShaft = [MIC_CX + 9.8, y - 8.5, 178 + z];
  const wheelShaft2 = [MIC_CX + 9.8, y + 8.5, 178 + z];
  put(micBoxOf([wheelShaft, wheelShaft2], 1), rod(wheelShaft, wheelShaft2, .55, MIC_STEEL, toneI, .5));
  for (let i = 0; i < 3; i++){
    const wz = 172 + z + i * 4.4;
    const a = [MIC_CX + 9.8, y - 6.2, wz];
    const b = [MIC_CX + 9.8, y + 6.2, wz];
    put(micBoxOf([a, b], 2.5), rod(a, b, 2.1, i === 0 ? MIC_BUTTON : MIC_RING, toneI, .65), `counter-wheel-${i + 1}`);
  }

  const ejectRodTop = [MIC_CX + 8, y + 4.9, 138 + z - st.eject * 2.8];
  const ejectRodBot = [MIC_CX + 8, y + 4.9, 108 + z - st.eject * 6];
  put(micBoxOf([ejectRodTop, ejectRodBot], 1), rod(ejectRodBot, ejectRodTop, .65, MIC_STEEL, toneI, .55), 'ejector-rod');
  const ejSpring = micHelix(MIC_CX + 8, y + 4.9, 114 + z, 132 + z - st.eject * 2.8, 2.2, 6, .5);
  put(micBoxOf(ejSpring, 3), micStroke(ejSpring, MIC_EJECT.l, .42), 'ejector-spring');

  const horizA = [MIC_CX + 8, y, 138 + z - st.eject * 2.8];
  const horizB = [MIC_CX + 16.8, y, 138 + z - st.eject * 2.8];
  put(micBoxOf([horizA, horizB], 1), rod(horizA, horizB, .62, MIC_STEEL, toneI, .52), 'ejector-link');

  const sleeveA = micRing(y, 82 + z - st.eject * 6, 10.1, 10.7, 24);
  const sleeveB = micRing(y, 110 + z - st.eject * 6, 9.5, 10.3, 24);
  const sleeve = micLoft(sleeveA, sleeveB, MIC_RING);
  put(micBoxOf([...sleeveA, ...sleeveB], .5), sleeve + ink(pd(sleeveA), .8) + ink(pd(sleeveB), .65), 'ejector-sleeve');

  const airTop = [MIC_CX, y, 128 + z - down];
  const airBottom = [MIC_CX, y, Math.max(42 + z, MIC_TIP_Z0 + z + 4 + st.tipFill * 58)];
  put(micBoxOf([airTop, airBottom], 1), `<path d="${pd([airTop, airBottom], false)}" fill="none" stroke="${MIC_AIR}" stroke-width="2.2" stroke-dasharray="3 2" opacity=".8"/>`, 'air-cushion');

  return byDepth(parts);
}

function micCalloutItems(st){
  const x = st.pipX ?? MIC_CX;
  const y = st.pipY ?? MIC_SRC_Y;
  const z = st.baseZ;
  const down = st.button * 6.5;
  const moving = st.busy || st.phase === 'aspirate' || st.phase === 'dispense';
  return [
    { at:[x, y, 216 + z - down], text:'按钮', on:moving },
    { at:[x + 17, y, 157 + z], text:'量程环', on:st.volAnim > .01 },
    { at:[x + 10, y, 178 + z], text:'计数轮', on:st.volAnim > .01 },
    { at:[x, y, 157 + z - down], text:'柱塞', on:moving },
    { at:[x, y, 138 + z - down], text:'活塞', on:moving },
    { at:[x, y, 131 + z - down], text:'密封圈', on:moving },
    { at:[x + 5, y + 1, 120 + z], text:'回位弹簧', on:moving },
    { at:[x, y, 92 + z], text:'空气柱', on:st.tipFill > .01 },
    { at:[x, y, 97 + z - st.eject * 6], text:'退头套', on:st.eject > .01 },
    { at:[x, y, 47 + z], text:'吸头', on:st.tipAttached && st.tipFill > .01 }
  ];
}

function micSurfaceLabels(st){
  const x = st.pipX ?? MIC_CX;
  const y = st.pipY ?? MIC_SRC_Y;
  const z = st.baseZ;
  return tag([x + 17, y, 181 + z], 43, 6, '量程', st.volAnim > .01);
}

function micScene(st, material){
  const micBoardTop = boardTop(0, 0, MIC_W, MIC_D, 3, 9);
  const x = st.pipX ?? MIC_CX;
  const y = st.pipY ?? MIC_SRC_Y;
  let s = micSoftShadow([
    [0, 0, 3], [MIC_W, 0, 3], [MIC_W, MIC_D, 3], [0, MIC_D, 3]
  ], 0, null, .10, .10);
  s += board(0, 0, MIC_W, MIC_D, 3, 9, BOARD);

  s += micContactShadow(st.beakerX, st.beakerY, 3.12, 20, 20, .13);
  for (const sol of MIC_SOLUTIONS) s += micContactShadow(sol.x, sol.y, 3.12, 12, 12, .12);
  s += micPipetteShadow(st, micBoardTop);

  s += micSink(st);
  s += micWasteBox(st);
  const active = micNearSolution(st);
  const vialParts = MIC_SOLUTIONS.map(sol => {
    const center = P(sol.x, sol.y, 20);
    const blast = micBlastVector(`vial${sol.id}`, st);
    return {
      box: micBoxOf([
        [sol.x - 12, sol.y - 12, 3],
        [sol.x + 12, sol.y + 12, 39]
      ]),
      svg: `<g data-solution="${sol.id}" data-active="${active?.id === sol.id}" data-blast="${f(blast.b)}" transform="translate(${f(blast.dx)} ${f(blast.dy)}) rotate(${f(blast.rot)} ${f(center[0])} ${f(center[1])})">${micSolutionVial(st, sol, active?.id === sol.id)}</g>`
    };
  });
  s += byDepth(vialParts);
  s += micBeaker(st);
  const k = ease(st.xr || 0);
  s += micPipetteObject(st, material, k);
  s += micMushroom(st);
  s += micExplosion(st);

  if (k > .6) s += xrCallouts(micCalloutItems(st), [0, MIC_W, 0, MIC_D, 0, MIC_H]);
  else s += micSurfaceLabels(st);
  return s;
}

let pipUi;

function micFresh(){
  return {
    volIndex:2,
    volume:300,
    phase:'idle',
    busy:false,
    animT:0,
    runId:0,
    button:0,
    baseZ:MIC_BASE_Z,
    pipX:MIC_NEUTRAL_X,
    pipY:MIC_NEUTRAL_Y,
    beakerX:MIC_MIX_X,
    beakerY:MIC_MIX_Y,
    beakerLift:0,
    contents:{ A:0, B:0, C:0 },
    sourceLevels:{ A:.92, B:.92, C:.92 },
    tipFill:0,
    tipColor:null,
    tipAttached:true,
    tipDirty:false,
    tipFalling:false,
    tipInWaste:false,
    tipDrop:0,
    wasteTips:0,
    loadedSource:null,
    loadedVolume:0,
    lastSource:null,
    success:0,
    successT:0,
    successful:false,
    blackness:0,
    blast:0,
    blastX:MIC_MIX_X,
    blastY:MIC_MIX_Y,
    mistakes:0,
    wasted:false,
    sinkFlash:0,
    eject:0,
    volAnim:0,
    volAngle:0,
    xr:0,
    xrT:0
  };
}

function micLerp(a, b, t){ return a + (b - a) * Math.max(0, Math.min(1, t)); }

function micBegin(st, phase){
  const id = ++st.runId;
  st.phase = phase;
  st.busy = true;
  st.animT = 0;
  return id;
}

function micPenalty(st, ui, message){
  st.mistakes = Math.min(3, (st.mistakes || 0) + 1);
  st.wasted = st.mistakes >= 3;
  ui.flash(`${message} · 罚抄实验室守则 ${st.mistakes}/3`, 2300);
}

function micChooseVolume(index, st, ui){
  if (st.busy) return ui.flash('当前动作结束后再调量程', 1800);
  if (st.tipFill > .01) return micPenalty(st, ui, '吸头内已有溶液，不能调量程');
  if (st.successful) return ui.flash('实验已经完成，可以重新开始', 1500);
  if (index === st.volIndex && st.volAnim <= 0) return ui.flash('已经是这个量程', 1200);
  const id = ++st.runId;
  const from = st.volAngle;
  const to = from + (index > st.volIndex ? 150 : -150);
  st.volAnim = .001;
  ui.animate(dt => {
    if (id !== st.runId) return false;
    st.volAnim = Math.min(1, st.volAnim + dt / .55);
    st.volAngle = from + (to - from) * ease(st.volAnim);
    if (st.volAnim >= 1){
      st.volIndex = index;
      st.volume = MIC_VOLUMES[index];
      st.volAnim = 0;
      return false;
    }
    return true;
  });
}

function micAspirate(st, ui){
  if (st.busy) return ui.flash('当前动作还没有结束', 1600);
  if (st.successful) return ui.flash('配方已经完成，可以重新开始', 1500);
  if (!st.tipAttached) return micPenalty(st, ui, '当前没有吸头');
  if (st.tipFill > .005) return micPenalty(st, ui, '吸头内已有溶液，不能再次吸取');
  if (st.tipDirty) return micPenalty(st, ui, '必须先到废吸头盒更换吸头');
  const source = micNearSolution(st);
  if (!source) return micPenalty(st, ui, '移液器没有对准 A、B 或 C 溶液');
  st.tipColor = source.color;
  const id = micBegin(st, 'aspirate');
  const source0 = st.sourceLevels[source.id];
  const amount = st.volume;
  const fillFraction = amount / 1000;
  ui.animate(dt => {
    if (id !== st.runId) return false;
    st.animT = Math.min(1, st.animT + dt / 2.35);
    const t = st.animT;
    if (t < .2){
      st.button = .64 * ease(t / .2);
      st.baseZ = MIC_BASE_Z;
    } else if (t < .36){
      st.button = .64;
      st.baseZ = MIC_BASE_Z - 20 * ease((t - .2) / .16);
    } else if (t < .72){
      st.baseZ = 10;
      const k = ease((t - .36) / .36);
      st.button = .64 * (1 - k);
      st.tipFill = fillFraction * k;
    } else if (t < .9){
      st.button = 0;
      st.baseZ = 10 + 20 * ease((t - .72) / .18);
    } else {
      st.button = 0;
      st.baseZ = MIC_BASE_Z;
      st.tipFill = fillFraction;
    }
    if (t >= 1){
      st.sourceLevels[source.id] = Math.max(.08, source0 - .08 - .1 * fillFraction);
      st.tipFill = fillFraction;
      st.loadedSource = source.id;
      st.loadedVolume = amount;
      st.lastSource = source.id;
      st.button = 0;
      st.baseZ = MIC_BASE_Z;
      st.busy = false;
      st.phase = 'loaded';
      return false;
    }
    return true;
  });
}

function micDispense(st, ui){
  if (st.busy) return ui.flash('当前动作还没有结束', 1600);
  if (st.successful) return ui.flash('配方已经完成，可以重新开始', 1500);
  if (!st.tipAttached) return micPenalty(st, ui, '没有吸头可以排液');
  if (st.tipFill <= .005 || !st.loadedSource) return micPenalty(st, ui, '吸头里没有可加入的溶液');
  if (!micNearBeaker(st)) return micPenalty(st, ui, '移液器没有对准烧杯');
  const amount = st.loadedVolume;
  if (micMixTotal(st) + amount > MIC_CAPACITY) return micPenalty(st, ui, '烧杯会超过 1000 µL');
  const id = micBegin(st, 'dispense');
  const startFill = st.tipFill;
  const sourceId = st.loadedSource;
  ui.animate(dt => {
    if (id !== st.runId) return false;
    st.animT = Math.min(1, st.animT + dt / 2.55);
    const t = st.animT;
    if (t < .22){
      st.baseZ = micLerp(MIC_BASE_Z, 18, ease(t / .22));
    } else if (t < .72){
      st.baseZ = 18;
      const k = ease((t - .22) / .5);
      st.button = .64 * k;
      st.tipFill = micLerp(startFill, st.volume / 12000, k);
    } else if (t < .88){
      const k = ease((t - .72) / .16);
      st.button = .64 + .36 * k;
      st.tipFill = (st.volume / 12000) * (1 - k);
    } else {
      const k = ease((t - .88) / .12);
      st.button = 1 - k;
      st.baseZ = micLerp(18, MIC_BASE_Z, k);
      st.tipFill = 0;
    }
    if (t >= 1){
      st.contents[sourceId] = (st.contents[sourceId] || 0) + amount;
      st.tipDirty = true;
      st.loadedSource = null;
      st.loadedVolume = 0;
      st.lastSource = sourceId;
      st.tipColor = null;
      st.button = 0;
      st.baseZ = MIC_BASE_Z;
      st.tipFill = 0;
      st.busy = false;
      st.phase = 'idle';
      if (micExactTarget(st)) micCelebrate(st, ui);
      else if ((st.contents[sourceId] || 0) > MIC_TARGET[sourceId]) micPenalty(st, ui, `${sourceId} 溶液加多了`);
      else if (micMixTotal(st) >= MIC_CAPACITY) micPenalty(st, ui, '烧杯已满，但配比不正确');
      return false;
    }
    return true;
  });
}

function micExactTarget(st){
  return MIC_SOLUTIONS.every(sol => Math.abs((st.contents[sol.id] || 0) - sol.target) < .001);
}

function micCelebrate(st, ui){
  if (st.successful) return;
  st.successful = true;
  st.busy = true;
  st.phase = 'success';
  st.success = 1;
  st.successT = 0;
  st.blackness = 0;
  st.blast = 0;
  st.blastX = st.beakerX;
  st.blastY = st.beakerY;
  st.button = 0;
  st.baseZ = MIC_BASE_Z;
  ui.flash('配比正确。金色溶液正在生成', 1800);
  const id = st.runId;
  ui.animate(dt => {
    if (id !== st.runId || !st.successful) return false;
    st.successT += dt;
    if (st.successT < 3){
      st.phase = 'success';
      return true;
    }
    if (st.successT < 3.65){
      st.phase = 'blacken';
      st.blackness = ease((st.successT - 3) / .65);
      return true;
    }
    if (st.successT < 5.55){
      if (st.phase !== 'explosion'){
        st.phase = 'explosion';
        st.blastX = st.beakerX;
        st.blastY = st.beakerY;
      }
      st.blackness = 1;
      st.blast = ease((st.successT - 3.65) / 1.9);
      return true;
    }
    st.blackness = 1;
    st.blast = 1;
    st.success = 1;
    st.phase = 'destroyed';
    st.busy = false;
    st.successT = Math.max(st.successT, 5.55);
    return false;
  });
}

function micChangeTip(st, ui){
  if (st.busy) return ui.flash('当前动作还没有结束', 1500);
  if (st.successful) return ui.flash('实验已经完成', 1300);
  if (!micNearWaste(st)) return micPenalty(st, ui, '没有对准废吸头盒');
  if (st.tipFill > .01) return micPenalty(st, ui, '吸头内还有溶液，不能退头');
  if (!st.tipAttached) return ui.flash('正在装新吸头', 1200);
  if (!st.tipDirty) return micPenalty(st, ui, '这个吸头还没有用过');
  const id = micBegin(st, 'tipswap');
  let released = false;
  ui.animate(dt => {
    if (id !== st.runId) return false;
    st.animT = Math.min(1, st.animT + dt / 1.65);
    const t = st.animT;
    if (t < .34){
      st.eject = ease(t / .34);
    } else if (t < .78){
      if (!released){
        released = true;
        st.tipAttached = false;
        st.tipFalling = true;
        st.tipDrop = 0;
      }
      st.eject = 1;
      st.tipDrop = ease((t - .34) / .44);
    } else {
      st.tipFalling = false;
      st.tipDrop = 0;
      st.tipAttached = true;
      st.eject = 1 - ease((t - .78) / .22);
    }
    if (t >= 1){
      st.eject = 0;
      st.tipAttached = true;
      st.tipDirty = false;
      st.tipColor = null;
      st.wasteTips = Math.min(3, (st.wasteTips || 0) + 1);
      st.busy = false;
      st.phase = 'idle';
      ui.flash('已换上新的干净吸头', 1600);
      return false;
    }
    return true;
  });
}

function micEmptyBeaker(st, ui){
  if (st.busy) return ui.flash('当前动作还没有结束', 1600);
  const total = micMixTotal(st);
  if (total <= 0 && st.success <= 0) return ui.flash('烧杯已经是空的', 1400);
  const id = micBegin(st, 'empty');
  const x0 = st.beakerX, y0 = st.beakerY;
  let cleared = false;
  ui.animate(dt => {
    if (id !== st.runId) return false;
    st.animT = Math.min(1, st.animT + dt / 1.25);
    const t = st.animT;
    if (!cleared && t >= .16){
      cleared = true;
      st.contents = { A:0, B:0, C:0 };
      st.success = 0;
      st.successT = 0;
      st.successful = false;
      st.sinkFlash = 1;
    }
    st.sinkFlash = Math.max(0, 1 - t);
    const k = ease(t);
    st.beakerX = micLerp(x0, MIC_MIX_X, k);
    st.beakerY = micLerp(y0, MIC_MIX_Y, k);
    st.beakerLift = 5 * Math.sin(Math.PI * Math.min(1, t * 1.4));
    if (t >= 1){
      st.beakerX = MIC_MIX_X;
      st.beakerY = MIC_MIX_Y;
      st.beakerLift = 0;
      st.busy = false;
      st.phase = 'idle';
      ui.flash('烧杯已在水槽清空', 1600);
      return false;
    }
    return true;
  });
}

function micReset(st, ui){
  const keep = { pal:st.pal, xr:st.xr, xrT:st.xrT };
  const reset = Object.assign(micFresh(), keep);
  Object.assign(st, reset);
  ui.flash('实验已重置', 1300);
}

function micPrimary(st, ui){
  if (st.tipFill > .005) return micDispense(st, ui);
  if (micNearSolution(st)) return micAspirate(st, ui);
  if (micNearWaste(st)) return micChangeTip(st, ui);
  return micPenalty(st, ui, '主按钮不在任何有效工位');
}

pipUi = mountFigure({
  fig:'02',
  turn:'full',
  title:'微量移液器',
  palette:'cobalt',
  size:[MIC_W, MIC_D, MIC_H],

  state:micFresh(),
  scene:micScene,
  readout:st => st.phase,
  buttons:[
    { label:'选择量程', choices:st => MIC_VOLUMES.map((v, i) => ({
      label:`${v} µL`,
      current:st.volIndex === i,
      disabled:st.busy || st.tipFill > .01 || st.successful,
      why:st.busy ? '当前动作还没有结束' : st.successful ? '配方已经完成' : '吸头内已有样本',
      onClick:(state, api) => micChooseVolume(i, state, api)
    })) },
    { label:'吸入溶液', onClick:micAspirate },
    { label:'加入烧杯', onClick:micDispense },
    { label:'重新开始', onClick:micReset }
  ],
  acts:{
    plunger:(st, el, ui) => micPrimary(st, ui),
    eject:(st, el, ui) => micChangeTip(st, ui),
    volume:(st, el, ui) => micChooseVolume((st.volIndex + 1) % MIC_VOLUMES.length, st, ui),
    sink:(st, el, ui) => ui.flash('把烧杯拖到水槽中清空', 1700)
  },
  params:(st, q) => {
    if (q.has('vol')){
      const v = Math.max(0, Math.min(1000, +q.get('vol') || 300));
      const nearest = MIC_VOLUMES.map((x, i) => ({ x, i, d:Math.abs(x - v) })).sort((a, b) => a.d - b.d)[0];
      st.volIndex = nearest.i;
      st.volume = nearest.x;
    }
    if (q.has('pip')){
      const [x, y] = q.get('pip').split(',').map(Number);
      if (Number.isFinite(x) && Number.isFinite(y)){
        st.pipX = Math.max(12, Math.min(MIC_W - 12, x));
        st.pipY = Math.max(12, Math.min(MIC_D - 12, y));
      }
    }
    if (q.has('beaker')){
      const [x, y] = q.get('beaker').split(',').map(Number);
      if (Number.isFinite(x) && Number.isFinite(y)){
        st.beakerX = Math.max(20, Math.min(MIC_W - 20, x));
        st.beakerY = Math.max(12, Math.min(MIC_D - 12, y));
      }
    }
    if (q.has('mix')){
      const next = { A:0, B:0, C:0 };
      for (const part of q.get('mix').split(',')){
        const [id, value] = part.split(':');
        if (id in next) next[id] = Math.max(0, +value || 0);
      }
      st.contents = next;
    }
    if (q.has('loaded')){
      const [id, value] = q.get('loaded').split(':');
      if (MIC_SOLUTIONS.some(sol => sol.id === id)){
        st.loadedSource = id;
        st.loadedVolume = Math.max(0, Math.min(1000, +value || st.volume));
        st.tipFill = st.loadedVolume / 1000;
        st.tipColor = MIC_SOLUTIONS.find(sol => sol.id === id)?.color || null;
        st.lastSource = id;
        st.phase = 'loaded';
      }
    }
    if (q.get('success') === '1'){
      st.contents = { ...MIC_TARGET };
      st.success = 1;
      st.successT = 1.25;
      st.successful = true;
      st.phase = 'success';
      st.blackness = 0;
      st.blast = 0;
      st.blastX = st.beakerX;
      st.blastY = st.beakerY;
      st.wasteTips = +(q.get('wasteTips') || 3);
    }
    if (q.has('life')) st.successT = Math.max(0, +q.get('life') || 0);
    if (q.has('mistakes')){
      st.mistakes = Math.max(0, Math.min(3, +q.get('mistakes') || 0));
      st.wasted = st.mistakes >= 3;
    }
    if (q.get('fx') === 'black'){
      st.contents = { ...MIC_TARGET };
      st.success = 1;
      st.successT = 3.35;
      st.successful = true;
      st.phase = 'blacken';
      st.blackness = .72;
      st.blast = 0;
      st.blastX = st.beakerX;
      st.blastY = st.beakerY;
    }
    if (q.get('fx') === 'blast'){
      st.contents = { ...MIC_TARGET };
      st.success = 1;
      st.successT = 4.45;
      st.successful = true;
      st.phase = 'explosion';
      st.blackness = 1;
      st.blast = .62;
      st.blastX = st.beakerX;
      st.blastY = st.beakerY;
    }
    if (q.get('fx') === 'done'){
      st.contents = { ...MIC_TARGET };
      st.success = 1;
      st.successT = 5.55;
      st.successful = true;
      st.phase = 'destroyed';
      st.blackness = 1;
      st.blast = 1;
      st.blastX = st.beakerX;
      st.blastY = st.beakerY;
    }
    if (q.has('baseZ')) st.baseZ = Math.max(0, Math.min(55, +q.get('baseZ') || st.baseZ));
    if (q.has('button')) st.button = Math.max(0, Math.min(1, +q.get('button') || 0));
    if (q.has('eject')) st.eject = Math.max(0, Math.min(1, +q.get('eject') || 0));
    if (q.has('beakerLift')) st.beakerLift = Math.max(0, Math.min(8, +q.get('beakerLift') || 0));
    if (q.get('xr') === '1') st.xr = st.xrT = 1;
  }
});

function micPlaceRecipe(){
  if (innerWidth <= 560){
    micRecipe.style.left = '';
    return;

  const pip = document.querySelector('#fig [data-object="pipette"]');
  if (!pip) return;
  const stageRect = micStage.getBoundingClientRect();
  const pipRect = pip.getBoundingClientRect();
  const pipCenter = pipRect.left + pipRect.width / 2 - stageRect.left;
  const noteWidth = micRecipe.offsetWidth || 205;
  const preferredCenter = pipCenter < micStage.clientWidth / 2 ? micStage.clientWidth * .72 : micStage.clientWidth * .28;
  const minLeft = 160;
  const maxLeft = Math.max(minLeft, micStage.clientWidth - noteWidth - 96);
  micRecipe.style.left = `${Math.round(Math.max(minLeft, Math.min(maxLeft, preferredCenter - noteWidth / 2)))}px`;
}

function micSyncRecipe(){
  const st = pipUi.st;
  const activeSource = micNearSolution(st);
  micRecipe.querySelectorAll('.mic-recipe-line').forEach(line => {
    const id = line.dataset.sol;
    const current = st.contents[id] || 0;
    const target = MIC_TARGET[id];
    const value = line.querySelector('[data-current]');
    if (value) value.textContent = String(current);
    line.classList.toggle('done', Math.abs(current - target) < .001);
    line.classList.toggle('over', current > target);
    line.classList.toggle('active', activeSource?.id === id);
  });
  const total = micRecipe.querySelector('[data-total]');
  if (total) total.textContent = String(micMixTotal(st));
  const penalty = micRecipe.querySelector('[data-penalty]');
  if (penalty) penalty.textContent = String(Math.min(3, st.mistakes || 0));
  micRecipe.classList.toggle('complete', !!st.successful);
  micRecipe.classList.toggle('wasted', (st.mistakes || 0) >= 3);
  micPlaceRecipe();
}
