const micPointerPoint = event => {
  const matrix = micFigure.getScreenCTM();
  if (!matrix) return [0, 0];
  const point = new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix.inverse());
  return [point.x, point.y];
};

function micWorldDelta(startX, startY, startPoint, currentPoint, z=3){
  const p0 = P(startX, startY, z);
  const px = P(startX + 1, startY, z);
  const py = P(startX, startY + 1, z);
  const a = px[0] - p0[0], b = py[0] - p0[0];
  const c = px[1] - p0[1], d = py[1] - p0[1];
  const det = a * d - b * c || 1;
  const sx = currentPoint[0] - startPoint[0];
  const sy = currentPoint[1] - startPoint[1];
  return [(d * sx - b * sy) / det, (-c * sx + a * sy) / det];
}

micFigure.addEventListener('pointerdown', event => {
  if (event.button !== 0) return;
  const node = event.target.closest?.('[data-drag]');
  if (!node || pipUi.st.busy || pipUi.st.successful) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  const point = micPointerPoint(event);
  const kind = node.dataset.drag;
  micDrag = {
    kind,
    pointerId:event.pointerId,
    startPoint:point,
    moved:false,
    action:event.target.closest?.('[data-act]')?.dataset.act || '',
    startX:kind === 'pipette' ? pipUi.st.pipX : pipUi.st.beakerX,
    startY:kind === 'pipette' ? pipUi.st.pipY : pipUi.st.beakerY
  };
  try { micFigure.setPointerCapture(event.pointerId); } catch {}
  micFigure.classList.add('dragging-object');
}, true);

micFigure.addEventListener('pointermove', event => {
  if (!micDrag || event.pointerId !== micDrag.pointerId) return;
  event.preventDefault();
  event.stopImmediatePropagation();
  const point = micPointerPoint(event);
  const [dx, dy] = micWorldDelta(micDrag.startX, micDrag.startY, micDrag.startPoint, point, 3);
  if (Math.hypot(point[0] - micDrag.startPoint[0], point[1] - micDrag.startPoint[1]) > 2.5) micDrag.moved = true;
  if (micDrag.kind === 'pipette'){
    pipUi.st.pipX = Math.max(18, Math.min(MIC_W - 18, micDrag.startX + dx));
    pipUi.st.pipY = Math.max(12, Math.min(MIC_D - 12, micDrag.startY + dy));
  } else {
    pipUi.st.beakerX = Math.max(22, Math.min(MIC_W - 22, micDrag.startX + dx));
    pipUi.st.beakerY = Math.max(10, Math.min(MIC_D - 10, micDrag.startY + dy));
    pipUi.st.beakerLift = 5;
  }
  pipUi.invalidate();
}, true);

function micFinishDrag(event, cancelled=false){
  if (!micDrag || event.pointerId !== micDrag.pointerId) return;
  const drag = micDrag;
  micDrag = null;
  micFigure.classList.remove('dragging-object');
  try { micFigure.releasePointerCapture(event.pointerId); } catch {}
  if (cancelled){
    pipUi.render();
    return;
  }
  if (drag.kind === 'pipette' && !drag.moved && drag.action){
    if (drag.action === 'plunger') micPrimary(pipUi.st, pipUi);
    else if (drag.action === 'eject') micChangeTip(pipUi.st, pipUi);
    else if (drag.action === 'volume') micChooseVolume((pipUi.st.volIndex + 1) % MIC_VOLUMES.length, pipUi.st, pipUi);
    pipUi.render();
    return;
  }
  const st = pipUi.st;
  if (drag.kind === 'pipette'){
    const candidates = [
      ...MIC_SOLUTIONS.map(sol => ({ kind:'source', x:sol.x, y:sol.y })),
      { kind:'beaker', x:st.beakerX, y:st.beakerY },
      { kind:'waste', x:MIC_WASTE_X, y:MIC_WASTE_Y }
    ];
    let best = candidates[0];
    let bestD = Infinity;
    for (const item of candidates){
      const d = Math.hypot(st.pipX - item.x, st.pipY - item.y);
      if (d < bestD){ best = item; bestD = d; }
    }
    if (bestD < 23){
      st.pipX = best.x;
      st.pipY = best.y;
      if (best.kind === 'waste' && st.tipDirty) micChangeTip(st, pipUi);
    }
  } else {
    const overSink = micBeakerOverSink(st);
    st.beakerLift = 0;
    if (overSink) micEmptyBeaker(st, pipUi);
  }
  pipUi.render();
}

micFigure.addEventListener('pointerup', event => micFinishDrag(event, false), true);
micFigure.addEventListener('pointercancel', event => micFinishDrag(event, true), true);

addEventListener('keydown', e => {
  if (/input|textarea|button/i.test(e.target.tagName)) return;
  const key = e.key.toLowerCase();
  if (key === 'v') micChooseVolume((pipUi.st.volIndex + 1) % MIC_VOLUMES.length, pipUi.st, pipUi);
