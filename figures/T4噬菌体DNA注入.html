<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T4 噬菌体注入 DNA</title>
<style>.mcap{display:none!important}@media (max-width:560px){.stat .v{font-size:20px!important}.stats{align-items:flex-end}}@media (min-width:561px){.vset{top:4px!important}#stats{top:var(--vset-h,44px)!important}}</style><style>@media (max-width:560px){body > header{display:none}}</style><script>window.FIG_A = () => innerWidth <= 560 ? 1.1 : .75;</script><script>window.LBL_U = () => { if (innerWidth > 560) return 0; const s = document.getElementById("fig"); return s && s.clientWidth && s.viewBox.baseVal.width ? s.viewBox.baseVal.width / s.clientWidth : 0; };</script></head>
<body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
// text sits on a face: if its reading direction comes out mirrored (or edge-on), that face is turned away, so the text is hidden
const txM = (o, U, V) => (U[0]*V[1] - U[1]*V[0]) <= .02 * Math.hypot(...U) * Math.hypot(...V) ? `matrix(0 0 0 0 ${f(o[0])} ${f(o[1])})` : `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K, [sx, sy] = yawTurn(SH);
  const s = fill(sp(hull(pts3.map(([x,y,z]) => P(x+(z-z0)*sx*k, y+(z-z0)*sy*k, z0)))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  // on a phone (LBL_U = drawing units per screen px) the pill is a numbered badge and the names go in a legend under the figure
  const u = window.LBL_U ? LBL_U() : 0, n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));
  const k = INK_K, [X,Y] = P(...p3), fs = u ? 10*u : 8.6*k, h = u ? 17*u : fs*1.8, w = u ? h*(n > 9 ? 1.3 : 1) : text.length*fs*.62 + fs*1.5, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}" data-n="${n}" data-t="${text}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? n : text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------

    if (!(fq > 0)) continue;

    const src = `<svg xmlns="${NS}" width="${PW}" height="${PH}" viewBox="${rx} ${ry} ${rw} ${rh}"><filter id="n" filterUnits="userSpaceOnUse" x="${rx}" y="${ry}" width="${rw}" height="${rh}" color-interpolation-filters="sRGB">${tb.outerHTML}</filter><rect x="${rx}" y="${ry}" width="${rw}" height="${rh}" filter="url(#n)"/></svg>`;

      // store the noise's colour values fully opaque: the filter reads its colour channels, and an image with
      // see-through pixels would be read premultiplied (darker) by some browsers
      const px = g.getImageData(0, 0, PW, PH); for (let i = 3; i < px.data.length; i += 4) px.data[i] = 255; g.putImageData(px, 0, 0);

          if (c.disabled) return ui.flash(c.why || `${c.label} isn't possible right now`);

  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };

  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------
   xrCallouts(items, B): pills in two columns either side of the object, sorted top to bottom so leaders never cross.
     items: [{ at:[x,y,z], text, on }], B: the object's bounds [x0, x1, y0, y1, z0, z1].
   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);
  const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(x0), OUTp), on(PX(x1), OUTp), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...on(PX(x0), OUTp), ...on(PX(x1), OUTp)], 2.8) + `</g>`;
}
function xrMount(getUI, caption, opt = {}){   // opt.labelsOnly: only the Labels switch (the insides are on show already)
  const ui = getUI(), q = new URLSearchParams(location.search), html = document.documentElement;
  if (q.get('labels') !== '1') html.classList.add('nolabels');
  if (ui.st.xr == null){ ui.st.xr = 0; ui.st.xrT = 0; }
  if (q.get('xr') === '1') ui.st.xr = ui.st.xrT = 1;
  const old = document.getElementById('lblctl'); if (old) old.style.display = 'none';
  const vset = document.createElement('div'); vset.className = 'vset';
  vset.innerHTML = '<div class="vrow">' + (opt.labelsOnly ? '' : '<button class="act" id="xrb" aria-pressed="false">See-through</button>') + '<button class="act" id="lblb" aria-pressed="false">Labels</button></div>';
  document.querySelector('.stage').appendChild(vset);
  // pages with a stats panel in the top right: the switches go just under it
  const place = () => { const sp = document.getElementById('stats'); vset.style.top = sp ? (sp.offsetTop + sp.offsetHeight + 10) + 'px' : ''; };
  place(); new ResizeObserver(place).observe(document.getElementById('stats') || vset);
  const xrb = document.getElementById('xrb'), lblb = document.getElementById('lblb');
  const sync = () => { if (xrb) xrb.setAttribute('aria-pressed', !!getUI().st.xrT); lblb.setAttribute('aria-pressed', !html.classList.contains('nolabels')); };
  if (xrb) xrb.onclick = () => { const u = getUI(), st = u.st; st.xr = st.xr || 0; st.xrT = st.xrT ? 0 : 1; sync();
    u.animate(dt => { const g = Math.sign(st.xrT - st.xr); st.xr = Math.min(1, Math.max(0, st.xr + g*dt/.7)); return st.xr !== st.xrT; }); };
  lblb.onclick = () => { html.classList.toggle('nolabels'); sync(); };
  sync();
  const cap = document.createElement('p'); cap.className = 'mcap'; document.querySelector('.stage').after(cap);
  const css = document.createElement('style');
  css.textContent = '.vset{position:absolute;top:4px;right:0;z-index:2}.vrow{display:flex;gap:6px}.vset .act[aria-pressed=true]{background:var(--ink);color:var(--paper)}'
    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'
    + '@media (max-width:560px){.vset{position:static;margin:4px 0}}';
  document.head.appendChild(css);
  const r0 = ui.render; ui.render = () => { r0(); const st = getUI().st; cap.style.opacity = st.xr > .5 ? 1 : 0; cap.textContent = caption(st); };
  ui.render();
}
// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...A, ...B], 2.8) + `</g>`;
}
// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){
    let s = sceneFn.apply(this, arguments);
    const st = opts.getSt(), k = ease(st.xr || 0);
    if (k > 0 && opts.under) s = xrUnder(s, opts.mech(st, k), k);   // the whole drawing is the object
    else if (k > 0 && !opts.inline) s = `<g opacity="${f(1 - .5*k)}">${s}</g><g opacity="${f(k)}">${opts.mech(st, k)}</g>`;   // inline: the figure ghosts its own case
    const items = k > .6 ? opts.inside(st) : opts.surface ? opts.surface(st) : [];
    return s + (items.length ? xrCallouts(items, opts.B) : '');
  };
}

/* ---------- game keypad: mountKeypad({ rows, hub:[col,row], action:'DROP', keys:[{ key:'ArrowLeft', glyph:'\u25c0', name, at:[col,row] }] })
   An inked pad under the buttons that sends the same keyboard events as the arrows and space (set window.GAME_KEYS = true
   so the arrows play instead of turning the camera). ---------- */
function mountKeypad(spec){
  const host = document.getElementById('btns'); if (!host) return;
  const css = document.createElement('style');
  css.textContent = `.kpad{display:flex;align-items:center;gap:16px;margin-top:6px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;
      background:var(--paper);box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    .kpad .dp{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(var(--rows),34px);gap:3px}
    .kpad .k{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:34px;height:34px;cursor:pointer;
      background:#fbf7ea;border:1.5px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);color:var(--ink);font:700 13px ui-monospace,Menlo,monospace;
      transition:transform .05s,box-shadow .05s,background .05s}
    .kpad .hub{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
    .kpad .hub i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:#e6e0d1}
    .kpad .go{all:unset;box-sizing:border-box;width:62px;height:62px;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#e2483d;border:1.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18);color:#fff;font:800 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;
      transition:transform .05s,box-shadow .05s}
    .kpad .go small{font:700 8px ui-monospace,Menlo,monospace;opacity:.85;letter-spacing:.08em;margin-top:2px}
    .kpad .down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .kpad .k.down{background:var(--accent,#f4b829)}
    .kpad .go.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
    @media (max-width:560px){.kpad{gap:22px;padding:10px 16px}.kpad .dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(var(--rows),44px)}
      .kpad .k,.kpad .hub{width:44px;height:44px;font-size:15px}.kpad .go{width:74px;height:74px}}`;
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.className = 'kpad'; pad.setAttribute('role', 'group'); pad.setAttribute('aria-label', 'Keypad');
  const dp = document.createElement('div'); dp.className = 'dp'; dp.style.setProperty('--rows', spec.rows);
  const els = {};
  for (const k of spec.keys){
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', k.name);
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${spec.action}<small>SPACE</small>`; go.setAttribute('aria-label', spec.action);
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

const t4Lang = st => T4_UI[st.lang === 'en' ? 'en' : 'zh'];
const t4Title = (step, st) => st.lang === 'en' ? step.titleEn : step.title;
const t4Say = (step, st) => st.lang === 'en' ? step.sayEn : step.say;
const t4Detail = (step, st) => st.lang === 'en' ? step.detailEn : step.detail;

const t4BoundsOf = pts => [
  [0, 1, 2].map(i => Math.min(...pts.map(p => p[i])) - .8),
  [0, 1, 2].map(i => Math.max(...pts.map(p => p[i])) + .8)
];
const t4Ring = (x, y, z, r, n = 12, turn = 0) => Array.from({ length:n }, (_, i) => {
  const a = i / n * Math.PI * 2 + turn;
  return [x + r * Math.cos(a), y + r * Math.sin(a), z];
});
const t4BoxFromRings = rings => t4BoundsOf(rings.flat());
const t4RingAt = (ring, i) => ring[(i + ring.length) % ring.length];

function t4Prism(poly, z0, z1, material, weight = .9) {
  const low = poly.map(([x, y]) => [x, y, z0]);
  const high = poly.map(([x, y]) => [x, y, z1]);
  let out = '';
  if (vis([0, 0, -1])) out += shape(low, tone([0, 0, -1], material), weight);
  if (vis([0, 0, 1])) out += shape(high, tone([0, 0, 1], material), weight);
  for (let i = 0; i < poly.length; i++) {
    const j = (i + 1) % poly.length;
    const dx = poly[j][0] - poly[i][0], dy = poly[j][1] - poly[i][1];
    const normal = norm([dy, -dx, 0]);
    if (vis(normal)) out += shape([low[i], low[j], high[j], high[i]], tone(normal, material), weight);
  }
  return out + hullInk([...low, ...high], Math.max(1.3, weight * 1.8));
}

function t4Line(pts, color, width = .7) {
  const path = pd(pts, false);
  return `<path d="${path}" fill="none" stroke="${T4_INK}" stroke-width="${f(width + 1.1)}" stroke-linecap="round" stroke-linejoin="round"/>`
    + `<path d="${path}" fill="none" stroke="${color}" stroke-width="${f(width)}" stroke-linecap="round" stroke-linejoin="round"/>`;
}

const t4MixMat = (a, b, k) => ({
  l: mix(a.l, b.l, k),
  m: mix(a.m, b.m, k),
  d: mix(a.d, b.d, k)
});

const t4Lerp = (a, b, k) => a + (b - a) * k;
const t4Lift = st => T4_ZBASE + (st.lift || 0);

function t4TrimPath(pts, amount) {
  const k = Math.max(0, Math.min(1, amount));
  if (k <= 0) return [];
  const lengths = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const len = Math.hypot(...pts[i].map((v, j) => v - pts[i - 1][j]));
    lengths.push(len);
    total += len;
  }
  let left = total * k;
  const out = [pts[0]];
  for (let i = 1; i < pts.length; i++) {
    const len = lengths[i - 1];
    if (left >= len) {
      out.push(pts[i]);
      left -= len;
    } else {
      const u = len ? left / len : 0;
      out.push(pts[i - 1].map((v, j) => v + (pts[i][j] - v) * u));
      break;
    }
  }
  return out;
}

function t4Capsid(st, x, y, z0, material) {
  // Reference: QQ20261111-002944. The T4 head is a prolate icosahedron:
  // twelve vertices and twenty large triangular facets on a five-fold axis.
  const ringSpecs = [
    [42, 23, 0],
    [11, 23, Math.PI / 5]
  ];
  const top = [x, y, z0 + 58];
  const bottom = [x, y, z0];
  const rings = ringSpecs.map(([h, r, turn]) => t4Ring(x, y, z0 + h, r, 5, turn));
  const verts = [top, ...rings.flat(), bottom];
  const ringStart = i => 1 + i * 5;
  const faces = [];
  for (let i = 0; i < 5; i++) {
    const j = (i + 1) % 5;
    faces.push([0, ringStart(0) + i, ringStart(0) + j]);
  }
  for (let band = 0; band < rings.length - 1; band++) {
    const a0 = ringStart(band), b0 = ringStart(band + 1);
    for (let i = 0; i < 5; i++) {
      const j = (i + 1) % 5;
      const aI = a0 + i, aJ = a0 + j, bI = b0 + i, bJ = b0 + j;
      faces.push([aI, aJ, bI], [aJ, bJ, bI]);
    }
  }
  const last = ringStart(rings.length - 1);
  for (let i = 0; i < 5; i++) {
    const j = (i + 1) % 5;
    faces.push([verts.length - 1, last + j, last + i]);
  }

  const center = [x, y, z0 + 29];
  const faceData = faces.map(idx => {
    const tri = idx.map(i => verts[i]);
    let normal = norm(cross(sub(tri[1], tri[0]), sub(tri[2], tri[0])));
    if (dot(normal, sub(avg(tri), center)) < 0) normal = normal.map(v => -v);
    return { idx, tri, normal };
  });
  const supportViolations = faceData.reduce((sum, { tri, normal }) =>
    sum + verts.filter(v => dot(normal, sub(v, tri[0])) > .001).length, 0);
  const convex = supportViolations === 0;
  const visible = [];
  const edges = new Map();
  for (const { idx, tri, normal } of faceData) {
    if (!vis(normal)) continue;
    visible.push({
      at:avg(tri),
      box:t4BoundsOf(tri),
      svg:face(pd(tri), tone(normal, material)).replace('<path ', '<path data-facet="triangle" ')
    });
    for (const [a, b] of [[idx[0], idx[1]], [idx[1], idx[2]], [idx[2], idx[0]]]) {
      const key = a < b ? `${a}:${b}` : `${b}:${a}`;
      if (!edges.has(key)) edges.set(key, [verts[a], verts[b]]);
    }
  }
  let svg = `<g data-capsid="prolate-icosahedron" data-faces="${faces.length}" data-top="fivefold-apex" data-convex="${convex}" data-support-violations="${supportViolations}">${byDepth(visible)}`;
  for (const edge of edges.values()) svg += ink(pd(edge, false), .62);
  svg += hullInk(verts, 2.8) + '</g>';
  return { svg, box: t4BoundsOf(verts), top: z0 + 58 };
}

function t4Sheath(st, x, y) {
  const contract = st.contract || 0;
  const lift = t4Lift(st);
  const z0 = 20.5 + lift;
  const z1 = 66.5 + lift - 27 * contract;
  const radius = 6.1 + 3.3 * contract;
  const count = 14;
  const rings = Array.from({ length:count + 1 }, (_, i) => {
    const u = i / count;
    const z = z0 + (z1 - z0) * u;
    const bulge = t4Lerp(.04 * Math.sin(u * Math.PI * 7), .08 * Math.sin(u * Math.PI * 3), contract);
    const rr = radius * (1 + bulge);
    return t4Ring(x, y, z, rr, 12, u * Math.PI * t4Lerp(.34, .5, contract));
  });
  const material = t4MixMat(T4_SHEATH, T4_SHEATH_HOT, contract);
  let svg = '';
  for (let i = 0; i < rings.length - 1; i++) svg += loft(rings[i], rings[i + 1], n => tone(n, material));
  for (let h = 0; h < 6; h++) {
    for (let i = 0; i < rings.length - 1; i++) {
      const a = t4RingAt(rings[i], h * 2);
      const b = t4RingAt(rings[i + 1], h * 2);
      const mx = (a[0] + b[0]) / 2 - x, my = (a[1] + b[1]) / 2 - y;
      if (vis([mx, my, 0])) svg += line([a, b], .35);
    }
  }
  for (let i = 1; i < rings.length - 1; i++) {
    for (let k = 0; k < 12; k++) {
      const a = t4RingAt(rings[i], k), b = t4RingAt(rings[i], k + 1);
      const mx = (a[0] + b[0]) / 2 - x, my = (a[1] + b[1]) / 2 - y;
      if (vis([mx, my, 0])) svg += line([a, b], .3);
    }
  }
  svg += hullInk(rings.flat(), 2.3);
  return { svg, box: t4BoxFromRings(rings), z0, z1 };
}

function t4Neck(x, y, z0, z1) {
  const rings = [t4Ring(x, y, z0, 7.2), t4Ring(x, y, z0 + (z1 - z0) * .35, 5.5), t4Ring(x, y, z1, 8.2)];
  let svg = loft(rings[0], rings[1], n => toneI(n, T4_PLATE)) + loft(rings[1], rings[2], n => toneI(n, T4_PLATE));
  svg += hullInk(rings.flat(), 1.7);
  return { svg:`<g data-neck="collar">${svg}</g>`, box:t4BoxFromRings(rings) };
}

function t4WhiskerGeometry(x, y, z) {
  return Array.from({ length:6 }, (_, i) => {
    const a = i / 6 * Math.PI * 2 + .16;
    const bendA = a + (i % 2 ? .09 : -.09);
    const tipA = a + (i % 2 ? -.04 : .04);
    const length = 13.8 + (i % 3) * 1;
    const start = [x + 7.7 * Math.cos(a), y + 7.7 * Math.sin(a), z + 1.1];
    const bend = [x + 11.2 * Math.cos(bendA), y + 11.2 * Math.sin(bendA), z - 4.5 - (i % 2) * 1.1];
    const tip = [x + length * Math.cos(tipA), y + length * Math.sin(tipA), z - 11 - (i % 3) * 1.3];
    return { i, start, bend, tip };
  });
}

function t4Whiskers(x, y, z) {
  const parts = [];
  for (const { i, start, bend, tip } of t4WhiskerGeometry(x, y, z)) {
    const box = t4BoundsOf([start, bend, tip]);
    const svg = `<g data-whisker="${i}" data-attached-to="neck" data-root="${start.join(',')}" data-tip="${tip.join(',')}">`
      + t4Line([start, bend, tip], T4_WHISKER.m, .48)
      + fill(pd(on(PZ(start[2]), ellUV(start[0], start[1], .72, .72, 8))), T4_WHISKER.l, `opacity=".88"`)
      + `</g>`;
    parts.push({ at:start, box, svg });
  }
  return parts;
}

function t4Baseplate(st, x, y) {
  const star = st.lock || 0;
  const lift = t4Lift(st);
  const z0 = 19.8 + lift;
  const z1 = 25.2 + lift - 3 * star;
  const parts = [];
  const hubRings = [t4Ring(x, y, z0, 7.2, 6), t4Ring(x, y, z1, 8.2 - 1.6 * star, 6, .12)];
  let hub = loft(hubRings[0], hubRings[1], n => toneI(n, T4_PLATE));
  hub += vis([0, 0, 1]) ? fill(pd(hubRings[1]), toneI([0, 0, 1], T4_PLATE)) + ink(pd(hubRings[1]), 1.0) : '';
  hub += hullInk(hubRings.flat(), 1.8);
  parts.push({ box:t4BoxFromRings(hubRings), svg:hub });

  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + .18;
    const half = Math.PI / 8.5;
    const r0 = 3.8;
    const r1 = 10.5 + 8.5 * star;
    const poly = [
      [x + r0 * Math.cos(a - half), y + r0 * Math.sin(a - half)],
      [x + r0 * Math.cos(a + half), y + r0 * Math.sin(a + half)],
      [x + r1 * Math.cos(a + half * .62), y + r1 * Math.sin(a + half * .62)],
      [x + (r1 + 2.3) * Math.cos(a), y + (r1 + 2.3) * Math.sin(a)],
      [x + r1 * Math.cos(a - half * .62), y + r1 * Math.sin(a - half * .62)]
    ];
    const petalZ0 = 20.4 + lift - .5 * star;
    const petalZ1 = 23.6 + lift + 1.6 * (1 - Math.abs(i - 2.5) / 2.5) - 2.9 * star;
    parts.push({
      box:t4BoundsOf(poly.flatMap(([px, py]) => [[px, py, petalZ0], [px, py, petalZ1]])),
      svg:t4Prism(poly, petalZ0, petalZ1, T4_PLATE, .8)
    });
  }
  return { parts, z1 };
}

function t4LongFibreGeometry(st, x, y) {
  const attached = st.attach || 0;
  const unfold = ease(attached);
  const lift = t4Lift(st);
  return Array.from({ length:6 }, (_, i) => {
    const a = i / 6 * Math.PI * 2 + .28;
    const ca = Math.cos(a), sa = Math.sin(a);
    const pa = [x + 7.2 * ca, y + 7.2 * sa, 22.8 + lift];
    const foldedElbow = [x + 9.5 * ca, y + 9.5 * sa, 22.8 + lift + 16];
    const tipX = x + T4_FIBRE_RADIUS * ca, tipY = y + T4_FIBRE_RADIUS * sa;
    const tipZ = t4SurfacePoint(tipX, tipY)[2];
    const foldedTip = [x + 10.5 * ca, y + 10.5 * sa, 22.8 + lift + 33];
    const openTip = [tipX, tipY, tipZ + .8];

    // Equal-length V: place the open knee on the perpendicular bisector of
    // baseplate-root to receptor-tip, choosing the outward/upward solution.
    const chordR = T4_FIBRE_RADIUS - 7.2;
    const chordZ = openTip[2] - pa[2];
    const chord = Math.hypot(chordR, chordZ);
    const halfChord = chord / 2;
    const kneeOffset = Math.sqrt(Math.max(0, T4_LONG_FIBRE_SEGMENT ** 2 - halfChord ** 2));
    let kneePerp = [ -chordZ / chord, chordR / chord ];
    if (kneePerp[0] < 0) kneePerp = kneePerp.map(v => -v);
    const kneeR = (7.2 + T4_FIBRE_RADIUS) / 2 + kneePerp[0] * kneeOffset;
    const kneeZ = (pa[2] + openTip[2]) / 2 + kneePerp[1] * kneeOffset;
    const openElbow = [x + kneeR * ca, y + kneeR * sa, kneeZ];
    const pe = foldedElbow.map((v, k) => v + (openElbow[k] - v) * unfold);
    const pt = foldedTip.map((v, k) => v + (openTip[k] - v) * unfold);
    return { i, pa, pe, pt, tipZ, mat:i % 2 ? T4_FIBRE : { l:'#f4d370', m:'#d5a82e', d:'#765511' } };
  });
}

function t4FibreParts(st, x, y) {
  const parts = [];
  const attached = st.attach || 0;
  const locked = st.lock || 0;
  for (const { i, pa, pe, pt, tipZ, mat } of t4LongFibreGeometry(st, x, y)) {
    const a1 = rod(pa, pe, .7, mat, toneI, 1.0, .58, 10);
    const a2 = rod(pe, pt, .55, mat, toneI, .9, .42, 10);
    parts.push({
      at:pa,
      box:t4BoundsOf([pa, pe]),
      svg:`<g data-tail-fibre="long-${i}" data-segment="proximal" data-from="${pa.join(',')}" data-to="${pe.join(',')}">${a1}</g>`
    });
    parts.push({
      at:pe,
      box:t4BoundsOf([pe, pt]),
      svg:`<g data-tail-fibre="long-${i}" data-segment="distal" data-from="${pe.join(',')}" data-to="${pt.join(',')}">${a2}</g>`
    });
    if (attached > .65) {
      const footK = Math.min(1, (attached - .65) / .35);
      const foot = [
        [pt[0] - 2.7 * footK, pt[1] - 2.7 * footK, tipZ + .1],
        [pt[0] + 2.7 * footK, pt[1] + 2.7 * footK, tipZ + 1.4 * footK]
      ];
      parts.push({
        box:foot,
        svg:cyl(pt[0], pt[1], tipZ + .1, tipZ + 1.15, 2.2 * footK, locked > .5 ? T4_PLATE : T4_FIBRE, toneI, .7, 14)
      });
    }
  }
  return parts;
}

function t4ShortFibreGeometry(st, x, y) {
  const locked = st.lock || 0;
  const lift = t4Lift(st);
  return Array.from({ length:6 }, (_, i) => {
    const a = i / 6 * Math.PI * 2 + .52;
    const ca = Math.cos(a), sa = Math.sin(a);
    const pa = [x + 8 * ca, y + 8 * sa, 22.6 + lift];
    const folded = [x + 10.8 * ca, y + 10.8 * sa, 29.5 + lift];
    const openX = x + 18 * ca, openY = y + 18 * sa;
    const open = [openX, openY, t4SurfacePoint(openX, openY)[2] + .7];
    const pb = folded.map((v, k) => v + (open[k] - v) * locked);
    return { i, pa, pb };
  });
}

function t4ShortFibres(st, x, y) {
  const parts = [];
  const locked = st.lock || 0;
  for (const { i, pa, pb } of t4ShortFibreGeometry(st, x, y)) {
    parts.push({
      box:t4BoundsOf([pa, pb]),
      svg:`<g data-tail-fibre="short-${i}" data-from="${pa.join(',')}" data-to="${pb.join(',')}">${rod(pa, pb, .48, T4_SHORT_FIBRE, toneI, .8, .36, 9)}</g>`
    });
    if (locked > .08) {
      parts.push({
        box:[[pb[0] - 1.5 * locked, pb[1] - 1.5 * locked, pb[2] - .7], [pb[0] + 1.5 * locked, pb[1] + 1.5 * locked, pb[2]]],
        svg:`<g data-tail-fibre="short-${i}" data-foot="true">${cyl(pb[0], pb[1], pb[2] - .7, pb[2], 1.25 * locked, matOf(T4_GOLD), toneI, .45, 10)}</g>`
      });
    }
  }
  return parts;
}

function t4TubeTip(st, x, y) {
  const penetration = st.contract || 0;
  if (penetration <= .005) return '';
  const z1 = 20.1 + t4Lift(st);
  const z0 = z1 - T4_TUBE_PENETRATION * penetration;
  const rings = [t4Ring(x, y, z0, 2.45, 14), t4Ring(x, y, z1, 2.45, 14)];
  let svg = loft(rings[0], rings[1], n => toneI(n, T4_TUBE));
  svg += fill(pd(rings[0]), toneI([0, 0, -1], T4_TUBE)) + ink(pd(rings[0]), .7);
  let gp5 = '';
  if (penetration > .72) {
    gp5 = `<g data-gp5-tip="true" data-at="${[x, y, z0 - 2.15].join(',')}">${rod([x, y, z0], [x, y, z0 - 4.3], 1.5, { l:'#ffe37b', m:'#e8b73a', d:'#8a5c10' }, toneI, .8, .16, 12)}</g>`;
  }
  svg += hullInk(rings.flat(), 1.3);
  return `<g data-tail-tube="true">${svg}${gp5}</g>`;
}

const T4_CELL_RX = 84;
const T4_CELL_RZ = T4_HOST_TOP;
const T4_ARC_START = 30;
const T4_ARC_END = 150;
const T4_FIBRE_RADIUS = 32;
const t4EllArc = (cu, cv, rx, rz, a0, a1, n = 40) => Array.from({ length:n + 1 }, (_, i) => {
  const angle = (a0 + (a1 - a0) * i / n) * Math.PI / 180;
  return [cu + rx * Math.cos(angle), cv + rz * Math.sin(angle)];
});
const t4ArcRing = (y, rx = T4_CELL_RX, rz = T4_CELL_RZ, n = 40) =>
  on(PY(y), t4EllArc(T4_AX, 0, rx, rz, T4_ARC_START, T4_ARC_END, n));
const t4SurfacePoint = (x, y) => {
  const edge = Math.cos(T4_ARC_START * Math.PI / 180);
  const dx = Math.max(-edge, Math.min(edge, (x - T4_AX) / T4_CELL_RX));
  return [x, y, T4_CELL_RZ * Math.sqrt(1 - dx * dx)];
};
const t4SurfaceNormal = (x, z) => norm([
  (x - T4_AX) / (T4_CELL_RX * T4_CELL_RX),
  0,
  z / (T4_CELL_RZ * T4_CELL_RZ)
]);
const t4ArcQuadBand = (y, outerRx, outerRz, innerRx, innerRz, color, n = 40) => {
  const outer = on(PY(y), t4EllArc(T4_AX, 0, outerRx, outerRz, T4_ARC_START, T4_ARC_END, n));
  const inner = on(PY(y), t4EllArc(T4_AX, 0, innerRx, innerRz, T4_ARC_START, T4_ARC_END, n));
  let out = '';
  for (let i = 0; i < outer.length - 1; i++) {
    out += face(pd([outer[i], outer[i + 1], inner[i + 1], inner[i]]), color);
  }
  out += ink(pd(outer, false), 1.1) + ink(pd(inner, false), 1.0);
  out += ink(pd([outer[0], inner[0]], false), .9) + ink(pd([outer[outer.length - 1], inner[inner.length - 1]], false), .9);
  return out;
};
function t4ArcLoft(A, B, material) {
  let out = '';
  for (let i = 0; i < A.length - 1; i++) {
    const quad = [A[i], A[i + 1], B[i + 1], B[i]];
    let normal = norm(cross(sub(A[i + 1], A[i]), sub(B[i], A[i])));
    if (!isFinite(normal[0])) continue;
    if (dot(normal, sub(avg(quad), [T4_AX, (A[i][1] + B[i][1]) / 2, 0])) < 0) normal = normal.map(v => -v);
    if (vis(normal)) out += face(pd(quad), tone(normal, material));
  }
  return out;
}

function t4HostUpper(st, surfaceMat) {
  const y0 = 4, y1 = 146;
  const outerA = t4ArcRing(y0), outerB = t4ArcRing(y1);
  const outerMat = t4MixMat(surfaceMat, T4_OUTER, .12);
  const cytoMat = T4_CYTOPLASM;
  const cytoA = t4ArcRing(y0, 74.8, 41.1), cytoB = t4ArcRing(y1, 74.8, 41.1);
  const pgA = t4ArcRing(y0, 79.8, 45.3), pgB = t4ArcRing(y1, 79.8, 45.3);
  const innerA = t4ArcRing(y0, 76.6, 43.0), innerB = t4ArcRing(y1, 76.6, 43.0);
  const capFace = (y, side) => {
    const fullFace = on(PY(y), t4EllArc(T4_AX, 0, 84, 48, T4_ARC_START, T4_ARC_END, 40));
    let cap = fill(pd(fullFace), cytoMat.l) + ink(pd(fullFace), 1.2);
    cap += `<g data-membrane="outer" data-side="${side}">${t4ArcQuadBand(y - .03, 84, 48, 77, 44, T4_OUTER.m)}</g>`;
    cap += `<g data-membrane="peptidoglycan" data-side="${side}">${t4ArcQuadBand(y - .05, 76.2, 43.8, 69.5, 40.2, T4_PG.m)}</g>`;
    cap += `<g data-membrane="inner" data-side="${side}">${t4ArcQuadBand(y - .07, 68.7, 40, 62, 36.3, T4_INNER.m)}</g>`;
    return cap;
  };
  const ends = [y0, y1].map(y => ({ y, depth: depthOf([T4_AX, y, 0]) })).sort((a, b) => a.depth - b.depth);
  let svg = '';
  svg += capFace(ends[0].y, 'far');

  svg += `<g data-membrane-wall="cytoplasm" opacity=".92">${t4ArcLoft(cytoA, cytoB, T4_CYTOPLASM)}</g>`;
  svg += `<g data-membrane-wall="peptidoglycan" opacity=".94">${t4ArcLoft(pgA, pgB, T4_PG)}</g>`;
  svg += `<g data-membrane-wall="inner" opacity=".96">${t4ArcLoft(innerA, innerB, T4_INNER)}</g>`;
  svg += `<g data-membrane-wall="outer" opacity=".9">${t4ArcLoft(outerA, outerB, outerMat)}</g>`;
  svg += hullInk([...outerA, ...outerB], 3);

  svg += capFace(ends[1].y, 'near');

  const digestion = st.contract || 0;
  if (digestion > .01) {
    const opening = on(PZ(T4_HOST_TOP + .08), ellUV(T4_AX, T4_AY, 2.8 + 2.2 * digestion, 2.2 + 1.6 * digestion, 20));
    svg += fill(pd(opening), '#173d33', `opacity="${f(.74 * digestion)}"`);
    svg += ink(pd(opening), 1.1);
  }

  // A faint inner circumference makes the open interior readable through the shell.
  svg += ink(pd(innerA), .75) + ink(pd(innerB), .75);

  // Six receptor clusters are placed exactly under the six fibre tips on the curved wall.
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + .28;
    const x = T4_AX + T4_FIBRE_RADIUS * Math.cos(a);
    const y = T4_AY + T4_FIBRE_RADIUS * Math.sin(a);
    const [px, py, pz] = t4SurfacePoint(x, y);
    const normal = t4SurfaceNormal(px, pz);
    if (!vis(normal)) continue;
    const base = [px - normal[0] * .7, py, pz - normal[2] * .7];
    const tip = [px + normal[0] * 2.1, py, pz + normal[2] * 2.1];
    let receptor = rod(base, tip, 1.35, T4_PLATE, toneI, .7, 1.0, 12);
    receptor += fill(pd(on(PZ(pz + 2.2), ellUV(px, py, 1.0, 1.0, 10))), T4_PLATE.l, `opacity="${f(.45 + .4 * (st.attach || 0))}"`);
    for (let j = 0; j < 4; j++) {
      const aa = a + j * Math.PI * 2 / 4 + .12;
      const ex = px + Math.cos(aa) * 4.6 + normal[0] * 2.4;
      const ey = py + Math.sin(aa) * 4.6;
      const ez = pz + normal[2] * 2.4 + 2.4;
      receptor += t4Line([tip, [ex, ey, ez]], T4_GOLD, .38);
      receptor += shape(on(PZ(ez), ellUV(ex, ey, .44, .44, 7)), T4_GOLD, .16);
    }
    svg += `<g data-receptor="${i}" data-at="${tip.join(',')}">${receptor}</g>`;
  }

  // Pili occur in irregular patches over the curved surface, not as a perimeter ring.
  const piliSeeds = [
    [-55, 22], [-48, 40], [-57, 67], [-51, 91], [-55, 121],
    [-32, 27], [-22, 58], [-31, 84], [-17, 116],
    [15, 23], [36, 42], [53, 69], [56, 95], [43, 123],
    [4, 37], [24, 76], [9, 109]
  ];
  for (let i = 0; i < piliSeeds.length; i++) {
    const [dx, yy] = piliSeeds[i];
    const [px, py, pz] = t4SurfacePoint(T4_AX + dx, yy);
    const normal = t4SurfaceNormal(px, pz);
    if (!vis(normal)) continue;
    const len = 8 + (i * 7) % 10;
    const side = i % 2 ? 1 : -1;
    const a = [px + normal[0], py, pz + normal[2]];
    const b = [px + normal[0] * len * .58, py + side * len * .32, pz + normal[2] * len * .58];
    const c = [px + normal[0] * len, py + side * len * .58, pz + normal[2] * len];
    svg += `<g data-pilus="${i}" data-structure="pilus">${t4Line([a, b, c], mix(surfaceMat.d, T4_PILUS, .5), .66)}</g>`;
  }

  return svg;
}

function t4FlagellaParts() {
  const specs = [
    [-1, 30, 54, 1.0, -1],
    [-1, 84, 68, .9, 1],
    [-1, 132, 52, .78, -1],
    [1, 30, 54, 1.0, 1],
    [1, 84, 68, .9, -1],
    [1, 132, 52, .78, 1]
  ];
  return specs.map(([side, yy, dx, scale, wave], i) => {
    const root = t4SurfacePoint(T4_AX + side * dx, yy);
    const normal = t4SurfaceNormal(root[0], root[2]);
    const out = (dist, lateral) => [
      root[0] + normal[0] * dist * scale + side * lateral * .18,
      root[1] + wave * lateral * .78,
      root[2] + normal[2] * dist * scale + lateral * .12
    ];
    const flag = [
      root,
      out(8, 4),
      out(14, 10),
      out(16, 17),
      out(12, 24),
      out(5, 31)
    ];
    const id = side < 0 ? `left-${i % 3}` : `right-${i % 3}`;
    return {
      at:root,
      side,
      id,
      box:t4BoundsOf(flag),
      svg:`<g data-flagellum="${id}" data-structure="flagellum" data-side="${side < 0 ? 'left' : 'right'}" data-root="${root.join(',')}">${t4Line(flag, T4_FLAGELLUM, 1.05)}</g>`
    };
  });
}

function t4PathLength(points) {
  let total = 0;
  for (let i = 1; i < points.length; i++) {
    total += Math.hypot(...points[i].map((v, j) => v - points[i - 1][j]));
  }
  return total;
}

function t4SlicePath(points, from, to) {
  if (points.length < 2) return [];
  const total = t4PathLength(points);
  const a = Math.max(0, Math.min(total, from));
  const b = Math.max(0, Math.min(total, to));
  if (b - a < .001) return [];
  const out = [];
  let travelled = 0;
  const add = p => {
    const prev = out[out.length - 1];
    if (!prev || Math.hypot(...p.map((v, j) => v - prev[j])) > .001) out.push(p);
  };
  for (let i = 1; i < points.length; i++) {
    const p0 = points[i - 1], p1 = points[i];
    const len = Math.hypot(...p1.map((v, j) => v - p0[j]));
    const s0 = travelled, s1 = travelled + len;
    if (s1 > a && s0 < b) {
      const u0 = len ? Math.max(0, (a - s0) / len) : 0;
      const u1 = len ? Math.min(1, (b - s0) / len) : 1;
      add(p0.map((v, j) => v + (p1[j] - v) * u0));
      add(p0.map((v, j) => v + (p1[j] - v) * u1));
    }
    travelled = s1;
  }
  return out;
}

function t4TwistPair(points, amount, twistRate = .28, amplitude = 1.15) {
  const path = t4TrimPath(points, amount);
  if (path.length < 2) return null;
  const dense = [];
  const lengths = [];
  let total = 0;
  for (let i = 1; i < path.length; i++) {
    const len = Math.hypot(...path[i].map((v, j) => v - path[i - 1][j]));
    lengths.push(len);
    total += len;
  }
  const samples = Math.max(24, Math.ceil(total * 1.5));
  for (let s = 0; s <= samples; s++) {
    let left = total * s / samples;
    let segment = 0;
    while (segment < lengths.length - 1 && left > lengths[segment]) {
      left -= lengths[segment];
      segment++;
    }
    const a = path[segment], b = path[Math.min(segment + 1, path.length - 1)];
    const u = lengths[segment] ? Math.min(1, left / lengths[segment]) : 0;
    dense.push(a.map((v, j) => v + (b[j] - v) * u));
  }
  const strandA = [], strandB = [];
  let travelled = 0;
  for (let i = 0; i < dense.length; i++) {
    if (i) travelled += Math.hypot(...dense[i].map((v, j) => v - dense[i - 1][j]));
    const before = dense[Math.max(0, i - 1)], after = dense[Math.min(dense.length - 1, i + 1)];
    const tangent = norm(sub(after, before));
    let side = cross(tangent, [0, 0, 1]);
    side = Math.hypot(...side) > .01 ? norm(side) : [1, 0, 0];
    const up = norm(cross(side, tangent));
    const angle = travelled * twistRate;
    const amp = amplitude;
    strandA.push(dense[i].map((v, j) => v + side[j] * Math.cos(angle) * amp + up[j] * Math.sin(angle) * amp));
    strandB.push(dense[i].map((v, j) => v - side[j] * Math.cos(angle) * amp - up[j] * Math.sin(angle) * amp));
  }
  return { strandA, strandB };
}

function t4DnaRoutes(x, y, headBottom, tubeTip) {
  const top = headBottom + 52;
  const head = [
    [x, y + 1, top],
    [x + 9, y + 3, top - 5],
    [x + 14, y - 2, top - 11],
    [x + 8, y - 9, top - 17],
    [x - 3, y - 10, top - 23],
    [x - 12, y - 5, top - 29],
    [x - 13, y + 5, top - 35],
    [x - 4, y + 10, top - 41],
    [x + 7, y + 7, top - 47],
    [x + 3, y + 1, headBottom + 3],
    [x, y, headBottom]
  ];
  const transit = [
    [x, y, headBottom - 2],
    [x + .35, y - .35, Math.max(tubeTip + 10, headBottom - 9)],
    [x + .65, y - .65, tubeTip]
  ];
  const entryZ = Math.max(tubeTip - 12, 8);
  const cytosol = [
    [x + 4, y - 2, entryZ],
    [x + 12, y - 8, Math.max(entryZ - 2, 7)],
    [x + 22, y - 12, Math.max(entryZ - 4, 6)],
    [x + 30, y - 8, Math.max(entryZ - 6, 5)],
    [x + 39, y, Math.max(entryZ - 8, 4)],
    [x + 45, y + 10, Math.max(entryZ - 11, 3.5)],
    [x + 37, y + 20, Math.max(entryZ - 14, 3)],
    [x + 24, y + 23, Math.max(entryZ - 17, 2.8)],
    [x + 10, y + 20, 5],
    [x - 4, y + 16, 4],
    [x - 18, y + 11, 6],
    [x - 29, y + 4, 9],
    [x - 34, y - 6, 12],
    [x - 27, y - 15, 15],
    [x - 14, y - 20, 18],
    [x + 1, y - 18, 20],
    [x + 15, y - 13, 17],
    [x + 25, y - 5, 14]
  ];
  return { head, transit, cytosol };
}

function t4DnaWindow(st, x, y, headBottom, tubeTip, mode = 'full') {
  const inject = Math.max(0, Math.min(1, st.inject || 0));
  const routes = t4DnaRoutes(x, y, headBottom, tubeTip);
  const headLength = t4PathLength(routes.head);
  const transitLength = t4PathLength(routes.transit);
  const cytosolLength = t4PathLength(routes.cytosol);
  const full = routes.head.concat(routes.transit.slice(1), routes.cytosol);
  const releaseDistance = Math.min(36, cytosolLength * .2);
  const start = inject * (headLength + transitLength + releaseDistance);
  const end = headLength + inject * (transitLength + cytosolLength);
  const from = mode === 'host' ? Math.max(start, headLength) : start;
  const visible = t4SlicePath(full, from, end);
  const remaining = Math.max(0, Math.min(1, (headLength - start) / headLength));
  const entryClearance = Math.max(0, start - headLength - transitLength);
  return { inject, visible, remaining, entryClearance, headLength, transitLength, cytosolLength };
}

function t4DnaLabelPoints(win, x, y, headBottom, tubeTip) {
  return {
    virusDna:win.visible.length ? win.visible[0] : [x, y, headBottom + 28]
  };
}

function t4DnaInjection(st, x, y, headBottom, tubeTip, mode = 'full') {
  const win = t4DnaWindow(st, x, y, headBottom, tubeTip, mode);
  const { inject, visible, remaining, entryClearance } = win;
  if (visible.length < 2) return '';
  const pair = t4TwistPair(visible, 1, .13, 1.05);
  if (!pair) return '';
  const labelPoints = t4DnaLabelPoints(win, x, y, headBottom, tubeTip);
  return `<g data-dna-route="continuous" data-dna-mode="${mode}" data-inject="${f(inject)}" data-head-remaining="${f(remaining)}" data-entry-clearance="${f(entryClearance)}" data-visible-length="${f(t4PathLength(visible))}" data-start="${visible[0].join(',')}" data-entry="${[x, y, tubeTip].join(',')}" data-virus-dna-anchor="${labelPoints.virusDna.join(',')}">`
    + `<g data-dna-strand="blue">${t4Line(pair.strandA, T4_DNA_A, 1.12)}</g>`
    + `<g data-dna-strand="red">${t4Line(pair.strandB, T4_DNA_B, 1.12)}</g></g>`;
}

function t4LabelAnchors(st, x = T4_AX, y = T4_AY) {
  const lift = t4Lift(st), contract = st.contract || 0, inject = st.inject || 0;
  const headBottom = 70.4 + lift - 27 * contract;
  const tubeTip = 20.1 + lift - T4_TUBE_PENETRATION * contract;
  const midpoint = (a, b, k = .5) => a.map((v, i) => v + (b[i] - v) * k);
  const nearest = items => items.reduce((best, item) =>
    !best || depthOf(item.at) > depthOf(best.at) ? item : best, null);
  const visDir = norm([CAM_V[0], CAM_V[1], 0]);

  const longFibres = t4LongFibreGeometry(st, x, y);
  const longFibre = nearest(longFibres.map(f => ({
    at:midpoint(f.pe, f.pt, .46),
    from:f.pe,
    to:f.pt
  })));

  const shortFibres = t4ShortFibreGeometry(st, x, y);
  const shortFibre = nearest(shortFibres.map(f => ({
    at:midpoint(f.pa, f.pb, .72),
    from:f.pa,
    to:f.pb
  })));

  const whiskers = t4WhiskerGeometry(x, y, headBottom - 3.1);
  const whisker = nearest(whiskers.map(f => ({
    at:midpoint(f.start, f.bend, .72),
    from:f.start,
    to:f.tip
  })));

  const sheathZ0 = 20.5 + lift;
  const sheathZ1 = 66.5 + lift - 27 * contract;
  const sheathRadius = 6.1 + 3.3 * contract;
  const sheath = [
    x + visDir[0] * sheathRadius * .96,
    y + visDir[1] * sheathRadius * .96,
    (sheathZ0 + sheathZ1) / 2
  ];

  const neckLoopRadius = 7.8;
  const neck = [
    x + visDir[0] * neckLoopRadius,
    y + visDir[1] * neckLoopRadius,
    headBottom - 2.1
  ];
  const capsid = [
    x + visDir[0] * 22.5,
    y + visDir[1] * 22.5,
    headBottom + 29
  ];

  const receptorCandidates = [];
  for (let i = 0; i < 6; i++) {
    const a = i / 6 * Math.PI * 2 + .28;
    const rx = x + T4_FIBRE_RADIUS * Math.cos(a);
    const ry = y + T4_FIBRE_RADIUS * Math.sin(a);
    const [px, py, pz] = t4SurfacePoint(rx, ry);
    const normal = t4SurfaceNormal(px, pz);
    if (vis(normal)) receptorCandidates.push({ at:[px + normal[0] * 2.3, py, pz + normal[2] * 2.3] });
  }
  const receptor = nearest(receptorCandidates)?.at || [x + visDir[0] * 42, y + visDir[1] * 28, T4_HOST_TOP];

  const sideAngle = CAM_V[0] >= 0 ? 68 : 112;
  const hostY0 = 4, hostY1 = 146;
  const edgeY = depthOf([x, hostY0, 0]) > depthOf([x, hostY1, 0]) ? hostY0 : hostY1;
  const layerPoint = (rx, rz) => [
    x + rx * Math.cos(sideAngle * Math.PI / 180),
    edgeY,
    rz * Math.sin(sideAngle * Math.PI / 180)
  ];
  const outerMembrane = layerPoint(80.5, 46);
  const peptidoglycan = layerPoint(72.85, 42);
  const innerMembrane = layerPoint(65.35, 38.15);
  const surface = t4SurfacePoint(x + visDir[0] * 52, y + 34);

  const tubeZ0 = 20.1 + lift - T4_TUBE_PENETRATION * contract;
  const tubeZ1 = 20.1 + lift;
  const tailTube = [x, y, (tubeZ0 + tubeZ1) / 2];
  const gp5Tip = [x, y, tubeZ0 - 2.15];

  const dnaWin = t4DnaWindow(st, x, y, headBottom, tubeTip, 'full');
  const { virusDna } = t4DnaLabelPoints(dnaWin, x, y, headBottom, tubeTip);

  return {
    longFibre:longFibre?.at || [x, y, 22.8 + lift],
    shortFibre:shortFibre?.at || [x, y, 22.6 + lift],
    baseplate:[x, y, 23.1 + lift - 1.6 * (st.lock || 0)],
    sheath,
    neck,
    whisker:whisker?.at || neck,
    capsid,
    surface,
    receptor,
    tailTube,
    gp5Tip,
    virusDna,
    outerMembrane,
    peptidoglycan,
    innerMembrane
  };
}

function t4StageLabelTargets(st, seeThrough = false) {
  const stage = st.anim || st.stage;
  const sets = [
    ['capsid', 'virusDna', 'whisker', 'sheath'],
    ['longFibre', 'receptor', 'surface', 'whisker'],
    ['longFibre', 'shortFibre', 'baseplate', 'receptor'],
    ['sheath', 'outerMembrane', 'peptidoglycan', 'innerMembrane'],
    ['virusDna', 'innerMembrane', 'surface']
  ];
  const targets = new Set(sets[Math.max(0, Math.min(4, stage))] || sets[0]);
  if (seeThrough && stage === 3) {
    targets.add('tailTube');
    targets.add('gp5Tip');
  }
  if (seeThrough && stage === 4) targets.add('tailTube');
  return targets;
}

const t4TextUnits = text => [...text].reduce((sum, ch) =>
  sum + (/[\u3000-\u9fff]/.test(ch) ? 1 : .62), 0);

function t4TagSize(text) {
  const u = window.LBL_U ? LBL_U() : 0;
  const n = ((window.__ln || (window.__ln = {}))[text] || (__ln[text] = Object.keys(__ln).length + 1));
  const k = INK_K;
  const fs = u ? 10 * u : 8.6 * k;
  const h = u ? 17 * u : fs * 1.8;
  const w = u ? h * (n > 9 ? 1.3 : 1) : t4TextUnits(text) * fs + fs * 1.5;
  return { w, h, k, n, fs, u };
}

function t4Tag(target, p3, dx, dy, text, on = false, center = null) {
  const { w, h, k, n, fs, u } = t4TagSize(text);
  const [X, Y] = P(...p3);
  const cx = center ? center[0] : X + dx * k;
  const cy = center ? center[1] : Y + dy * k;
  return `<g class="tag${on ? ' on' : ''}" data-n="${n}" data-t="${text}" data-anchor="${target}" data-at="${p3.join(',')}" data-ax="${f(X)}" data-ay="${f(Y)}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3 * k)}" fill="${INK}"/>`
    + `<rect x="${f(cx - w / 2)}" y="${f(cy - h / 2)}" width="${f(w)}" height="${f(h)}" rx="${f(h / 2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy + fs * .36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? n : text}</text></g>`;
}

function t4Callouts(items, B) {
  const pts = [];
  for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax) / 2;
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10 * u : 8.6 * k;
  const hgt = u ? 17 * u : fs * 1.8, gap = hgt + (u ? 3 * u : 3 * k);
  const left = [], right = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt * 1.3 + 12 * k : Math.max(...items.map(it => t4TextUnits(it.text))) * fs + fs * 1.5 + 12 * k;
  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  const entries = items.map(it => {
    const [X, Y] = P(...it.at);
    return { ...it, X, Y };
  });
  if (items.length >= 2) {
    for (const it of entries) (it.X < cx ? left : right).push(it);
    const moveNearestCenter = (from, to) => {
      let best = 0;
      for (let i = 1; i < from.length; i++) {
        if (Math.abs(from[i].X - cx) < Math.abs(from[best].X - cx)) best = i;
      }
      to.push(from.splice(best, 1)[0]);
    };
    while (left.length - right.length > 1) moveNearestCenter(left, right);
    while (right.length - left.length > 1) moveNearestCenter(right, left);
  } else {
    const side = roomL || !roomR ? left : right;
    for (const it of entries) side.push(it);
  }
  let out = '';
  const top = { [-1]:fs, [1]:fs + 30 * k };
  if (btn && svgEl.getScreenCTM()) {
    const r = btn.getBoundingClientRect();
    const q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt;
  }
  for (const [col, side] of [[left, -1], [right, 1]]) {
    col.sort((a, b) => a.Y - b.Y);
    let yy = -1e9;
    for (const c of col) {
      c.py = Math.max(c.Y, yy + gap, top[side]);
      yy = c.py;
    }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0;
    for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col) {
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1));
      const w = u ? hgt * (c.n > 9 ? 1.3 : 1) : t4TextUnits(c.text) * fs + fs * 1.5;
      let px = side < 0 ? xmin - 10 * k - w / 2 : xmax + 10 * k + w / 2;
      px = Math.max(vb.x + w / 2 + 2 * k, Math.min(vb.x + vb.width - w / 2 - 2 * k, px));
      const ex = px - side * w / 2;
      out += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}" data-anchor="${c.target}" data-at="${c.at.join(',')}" data-ax="${f(c.X)}" data-ay="${f(c.Y)}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side * -4 * k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4 * k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w / 2)}" y="${f(c.py - hgt / 2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt / 2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs * .36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return out;
}

function t4Scene(st, m) {
  const lift = t4Lift(st);
  const contract = st.contract || 0;
  const headBottom = 70.4 + lift - 27 * contract;
  const head = t4Capsid(st, T4_AX, T4_AY, headBottom, m);
  const neck = t4Neck(T4_AX, T4_AY, headBottom - 4.1, headBottom);
  const whiskers = t4Whiskers(T4_AX, T4_AY, headBottom - 3.1);
  const sheath = t4Sheath(st, T4_AX, T4_AY);
  const base = t4Baseplate(st, T4_AX, T4_AY);
  const fibres = t4FibreParts(st, T4_AX, T4_AY);
  const shortFibres = t4ShortFibres(st, T4_AX, T4_AY);
  const see = ease(st.xr || 0);
  const tubeTipZ = 20.1 + lift - T4_TUBE_PENETRATION * contract;

  const flagella = t4FlagellaParts();
  const hostCenterDepth = depthOf([T4_AX, T4_AY, T4_HOST_TOP * .5]);
  const backFlagella = flagella.filter(f => depthOf(f.at) <= hostCenterDepth)
    .map(f => `<g data-depth-layer="back">${f.svg}</g>`).join('');
  const frontFlagella = flagella.filter(f => depthOf(f.at) > hostCenterDepth)
    .map(f => `<g data-depth-layer="front">${f.svg}</g>`).join('');
  let svg = backFlagella
    + `<g data-part="bacterium">${t4HostUpper(st, m)}${frontFlagella}</g>`;

  const outerParts = [
    { box:head.box, svg:act('head', `<g data-part="capsid">${head.svg}</g>`) },
    { box:neck.box, svg:neck.svg },
    ...whiskers,
    { box:sheath.box, svg:act('sheath', sheath.svg) },
    ...base.parts.map(p => ({ ...p, svg:act('baseplate', p.svg) })),
    ...fibres,
    ...shortFibres
  ];

  if (see > 0.01) {
    const internal = t4DnaInjection(st, T4_AX, T4_AY, headBottom, tubeTipZ, 'full');
    svg += `<g opacity="${f(1 - .68 * see)}">${byDepth(outerParts)}</g>`;
    svg += `<g opacity="${f(see)}">${internal}</g>`;
    svg += `<g opacity="${f(see)}">${t4TubeTip(st, T4_AX, T4_AY)}</g>`;
    if (see > .6) svg += t4Callouts(t4SeeLabels(st), [0, T4_W, 0, T4_D, 0, T4_H]);
  } else {
    svg += byDepth(outerParts);
    svg += t4TubeTip(st, T4_AX, T4_AY);
    svg += t4DnaInjection(st, T4_AX, T4_AY, headBottom, tubeTipZ, 'host');
    svg += t4SurfaceTags(st);
  }
  return svg;
}

function t4StateForStage(stage) {
  return {
    stage,
    lift: stage === 0 ? T4_START_LIFT : stage === 1 ? T4_ATTACH_LIFT : T4_LOCKED_LIFT,
    attach: stage >= 1 ? 1 : 0,
    lock: stage >= 2 ? 1 : 0,
    contract: stage >= 3 ? 1 : 0,
    inject: stage >= 4 ? 1 : 0
  };
}

function t4RunSegment(st, target, api) {
  const tx = t4Lang(st);
  if (st.anim) {
    api.flash(tx.wait(st.anim), 1500);
    return;
  }
  if (target > st.stage + 1) {
    api.flash(`${tx.needFirst(st.stage)}${t4Title(T4_STEPS[st.stage], st)}`, 1800);
    return;
  }

  const base = Math.max(0, target - 1);
  Object.assign(st, t4StateForStage(base), { anim:target, segK:0 });
  const duration = [0, 1.65, 1.25, 1.55, 2.35][target];
  let elapsed = 0;
  api.animate(dt => {
    elapsed = Math.min(duration, elapsed + dt);
    const k = ease(elapsed / duration);
    st.segK = k;
    if (target === 1) {
      st.lift = T4_START_LIFT + (T4_ATTACH_LIFT - T4_START_LIFT) * k;
      st.attach = k;
    } else if (target === 2) {
      st.lock = k;
      st.lift = T4_ATTACH_LIFT + (T4_LOCKED_LIFT - T4_ATTACH_LIFT) * k;
    } else if (target === 3) {
      st.contract = k;
    } else if (target === 4) {
      st.inject = k;
    }
    if (elapsed < duration) return true;

    const final = t4StateForStage(target);
    Object.assign(st, final, { anim:null, segK:1 });
    api.flash(t4Title(T4_STEPS[target - 1], st), 1700);
    return false;
  });
}

function t4Reset(st, api) {
  Object.assign(st, t4StateForStage(0), { anim:null, segK:0 });
  api.flash(t4Lang(st).reset, 1500);
}

const t4Shown = st => Math.max(0, Math.min(4, st.stage));
const t4Progress = st => st.anim
  ? ((st.anim - 1) + (st.segK || 0)) * 25
  : t4Shown(st) * 25;
const t4ActiveStep = st => {
  const index = st.anim ? st.anim - 1 : t4Shown(st) - 1;
  return index >= 0 ? T4_STEPS[index] : null;
};
